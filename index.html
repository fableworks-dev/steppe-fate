<title>초원의 인연</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
/* 회갈색 질감의 시작 화면, 먹빛에 가까운 플레이 화면. 금빛 제목과 흰 본문 */
:root{
  --bg:#15110c; --bg2:#38332a; --surface:#1c1711; --surface2:#27211a; --ink:#efe7d6; --muted:#a39a86; --dim:#7d7565;
  --line:#3b3326; --gold:#d9bb7e; --gold2:#b8985a; --tan:#c0925f; --tan-ink:#1b130a; --bad:#d9705a; --good:#9fc27d;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(18px,env(safe-area-inset-top,0px)) 36px}
body.lite{background-color:var(--bg2);background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:110px 110px}

@media (max-width:700px){body.lite.titlemap{background-size:100% auto,110px 110px,110px 110px;background-position:center calc(50vh - 22.5vw),0 0,0 0}}
html:has(body.lite){background:var(--bg2)}
body.lite{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
body.playing{padding-block:max(8px,env(safe-area-inset-top,0px)) 24px}
.wrap{max-width:640px;margin:0 auto;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-weight:500;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.btn{display:block;width:100%;text-align:center;background:transparent;border:1px solid #6b604c;border-radius:8px;padding:12px 14px;min-height:48px;color:var(--ink)}
.btn:active{transform:scale(.985)} .btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--tan);border-color:var(--tan);color:var(--tan-ink);font-weight:500;font-size:16px}
.btn.primary:hover{filter:brightness(1.07)}
.btn.dim{color:var(--muted);font-size:14px}
.btn.opt{text-align:left;background:rgba(255,255,255,.02)}
.btn b{display:block;font-weight:500}
.btn small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:1px}
/* 시작 */
.cen{text-align:center}
.eyebrow{color:var(--muted);letter-spacing:.14em;font-size:15px;margin-top:34px}
.hero{font-size:44px;line-height:1.2;color:var(--gold);margin:22px 0 12px;font-weight:400}
.sub{color:var(--muted);font-size:15px}
hr.rule{border:0;border-top:1px solid #4a4233;margin:26px 0 30px}
.lead{color:var(--ink);margin:0 0 22px;font-size:15.5px;line-height:1.85}
.lab{color:var(--gold);font-weight:500;font-size:14px;margin:34px 0 6px}
.past{color:var(--muted);font-size:13.5px;line-height:1.95}
.foot{color:var(--dim);font-size:12.5px;text-align:center;line-height:1.9;margin:34px 0 18px}
/* 출생 */
.fate{display:grid;gap:12px}
.fate .k{text-align:center;color:var(--muted);font-size:14px;margin-top:6px}
.fate .big{text-align:center;color:var(--gold);font-size:30px;font-weight:400;margin:12px 0 18px;min-height:44px}
.fate .rows{display:grid;gap:9px;font-size:15px;animation:fin .5s ease-out}
.fate .r{display:grid;grid-template-columns:78px 1fr;gap:8px}
.fate .r i{font-style:normal;color:var(--gold)}
.fate .r b{font-weight:700}
.fate h3{color:var(--gold);font-size:15px;font-weight:500;margin:6px 0 2px}
.fate p{margin:0;color:var(--muted);font-size:14px}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--gold);color:var(--tan-ink);font-size:12px;font-weight:700;margin-left:6px}
.map{width:100%;height:auto;display:block;border-radius:2px;margin:10px 0 6px}
.map .sea{fill:#bdb398} .map .grid{stroke:#a69c82;stroke-width:1;fill:none}
.map .land path{fill:#968b73;stroke:#80765f;stroke-width:.8}
.map .lake path{fill:#bdb398;stroke:#80765f;stroke-width:.8}
.map .mlab text{fill:#4b4334;font-size:21px;text-anchor:middle} .map .mlab text.p{font-weight:700} .map .mlab text.t{font-size:16px}
.map .pin{fill:#c4472f;stroke:#fff;stroke-width:1.6} .map .pin2{fill:var(--gold);stroke:#1c1711;stroke-width:1.6}
.map .ring{fill:none;stroke:#c4472f;stroke-width:2;animation:ping 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}
.map .cb rect{fill:#1c1711;stroke:var(--gold);stroke-width:1.4} .map .cb text{fill:var(--ink);font-size:23px;text-anchor:middle}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(2.6);opacity:0}}
@keyframes fin{from{opacity:0;transform:translateY(-5px);background:rgba(217,187,126,.12)}to{opacity:1;transform:none}}
/* 플레이: 기본(모바일·좁은 화면)은 페이지 전체가 자연스럽게 스크롤된다 */
.pg{display:flex;flex-direction:column;gap:8px;min-width:0}
.topcard{background:var(--surface);border:1px solid var(--gold2);border-radius:12px;padding:10px 12px 8px;box-shadow:0 0 0 1px rgba(217,187,126,.08) inset}
.tc1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.tc1 .nm{color:var(--gold);font-size:23px;line-height:1.25;font-weight:700;overflow-wrap:anywhere;min-width:0}
.tc1 .age{flex:none;white-space:nowrap;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tc1 .age em{font-style:normal;font-size:26px;font-weight:700;color:var(--ink);margin-right:1px}
.tc2{display:flex;flex-wrap:wrap;gap:0 10px;font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.5}
.tc2 .loc{color:var(--tan)}
.tc3{font-size:14px;color:var(--gold);margin:3px 0 7px;line-height:1.45}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bar{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.bar span{display:flex;justify-content:space-between}
.bar span b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.bar div{height:6px;border-radius:3px;background:#2d261c;overflow:hidden}
.bar i{display:block;height:100%;background:#9fc27d;border-radius:3px}
.bar.w i{background:var(--gold)} .bar.low i{background:var(--bad)}
.tc4{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:9px}
.tc4 span{display:grid;justify-items:center;padding:3px 0;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.02)}
.tc4 i{font-style:normal;font-size:11.5px;color:var(--muted);line-height:1.4}
.tc4 b{font-size:16px;font-weight:700;color:var(--gold);line-height:1.3;font-variant-numeric:tabular-nums}
.tc5{display:flex;flex-wrap:wrap;gap:1px 10px;font-size:12px;color:var(--muted);margin-top:7px;line-height:1.55}
.tc5 b{color:var(--ink);font-weight:500}
.tmore{display:block;margin:6px 0 0 auto;padding:2px 4px;border:0;background:transparent;color:var(--dim);font-size:12px;min-height:26px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;font-size:14px;font-weight:500;color:var(--ink);padding:0 2px}
.tab[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(217,187,126,.08)}
.pbox{max-height:60dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.pbox:empty{display:none}
#ctlBox{display:grid;gap:8px}
.ctlr{display:grid;grid-template-columns:1.35fr 1.35fr .8fr;gap:6px}
.cb{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--ink);padding:0 8px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.cb .ic{width:14px;height:14px;fill:currentColor;flex:none}
.cb[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.cb.pz.on{background:var(--gold);color:var(--tan-ink);border-color:var(--gold);font-weight:700}
.cb.au.on{border-color:var(--gold);color:var(--gold);background:rgba(217,187,126,.1)}
.cb .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;flex:none}
.cb.au.on .dot{background:currentColor}
.cb.hm{color:var(--muted)}
.spd{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.spd .cb{padding:0;min-height:44px;font-size:14px;font-variant-numeric:tabular-nums}
.spd .cb[aria-pressed="true"]{background:var(--gold);color:var(--tan-ink);border-color:var(--gold);font-weight:700}
.prog{height:4px;border-radius:2px;background:#2d261c;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold)}
.alertbar{display:none;position:sticky;top:max(4px,env(safe-area-inset-top,0px));z-index:5;background:var(--gold);color:var(--tan-ink);border:0;border-radius:10px;padding:10px 6px;min-height:44px;font-size:14px;font-weight:700;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.alertbar .ic{width:13px;height:13px;fill:currentColor}
.alertbar.on{display:flex}
.pills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pill{padding:7px 2px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:13px;min-height:44px;color:var(--muted)}
.pill[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
/* 기록: 최신이 위 */
.feed{min-width:0;padding:2px 2px 20px;overflow-wrap:anywhere}
.dv{text-align:center;color:var(--dim);font-size:13px;margin:16px 0 10px}
.dv:first-child{margin-top:4px}
.fp{margin:0 0 12px;white-space:pre-line;font-size:16px;line-height:1.7}
.fp .sn{color:var(--dim);font-size:11.5px;margin-right:6px}
.nw{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.note{border-left:3px solid var(--gold2);background:rgba(217,187,126,.07);padding:7px 11px;margin:0 0 12px;font-size:13.5px;color:var(--muted);border-radius:0 6px 6px 0}
.note b{color:var(--gold);font-weight:700;margin-right:8px}
.ev{border-left:3px solid var(--gold2);background:rgba(217,187,126,.07);padding:8px 12px;margin:0 0 12px;border-radius:0 6px 6px 0}
.ev .t{color:var(--tan);font-weight:700}
.ev .t .sn{display:inline-block;color:var(--dim);font-size:11.5px;font-weight:400;margin-right:8px;vertical-align:1px}
.ev .pk{font-size:12.5px;color:var(--muted)}
.ev.kin-up{border-left-color:var(--good);background:rgba(159,194,125,.09)} .ev.kin-down{border-left-color:var(--bad);background:rgba(217,112,90,.09)}
.ev.kin-name{border-left-color:var(--gold);background:rgba(217,187,126,.13)} .ev.kin-name .pk{color:var(--gold);font-weight:700}

/* 이름 생성: 한 삶 안의 가족끼리, 그리고 최근에 쓴 이름과 겹치지 않도록 고른다. 풀은 v5.js 에서 넓힌다.
   (역사 인물의 이름은 이 함수와 무관하게 각 이벤트·역사 데이터에 고정되어 있다) */
const NAME_RECENT=[],NAME_USE={};
/* 역사적으로 중요한 인물의 고유 이름: 일반 인물에게는 배정하지 않는다(역사 인물 본인은 각 이벤트·역사 데이터에 고정되어 있다). */
const NAME_BLOCK=new Set(['우게데이','톨루이','몽케','보르테','쿠란','쿨란','소르칸','바우르친','수흐바타르','만두하이','테무게','에센','다이르','자랄웃딘','바하웃딘','유리','야로슬라프','미하일','블라디미르','벨라','헨리크','볼레스와프','칼만']);
/* 역사적으로 타당한 가까운 혈족에게만 허용하는 이름: 이름 → 해당 황금씨족 가문(인물 본인의 자손 가문) */
const NAME_KIN={'하단':['오고타이'],'사르탁':['주치'],'바이다르':['차가타이']};
function nameUsed(){
  const s=new Set(NAME_RECENT);
  if(typeof P!=='undefined'&&P){
    const add=o=>{if(o&&o.name)s.add(o.name);};
    add(P);add(P.father);add(P.mother);add(P.spouse);add(P.anda);
    (P.cowives||[]).forEach(add);(P.exSpouses||[]).forEach(add);
    (P.sibs||[]).forEach(add);(P.kids||[]).forEach(k=>{add(k);(k.kids||[]).forEach(add);add(k.inlaw);});
  }
  return s;
}
const CN_SUR=['이','장','왕','유','조','진','마','손','최','한','주','곽','양','서','하','노','당','우','임','고','송','정','심','반','방','채','전','강','변','오'];
const CN_GIV=['덕','충','안','순','영','성','광','걸','청','승','연','목','경','호','진','원','용','량','홍','택','인','명','창','준','현','도','복','문','태','근'];
const MO_STEM_M=['바트','수흐','간','엥흐','알탄','체렌','도르지','바얀','차간','사이한','투멘'],MO_SUF_M=['바타르','볼드','에르데네','수렌','셀렝'];
const MO_STEM_F=['알탄','엥흐','체첵','사랑','투야','오유','바야르','소욜'],MO_SUF_F=['게렐','투야','체첵','에르데네','마','수미야'];
function nameFor(cul,female,kin){
  /* kin: 황금씨족 가문 이름(그 가문의 혈족일 때), null 이면 혈족 아님, 생략하면 현재 인물(P)의 가문을 따른다 */
  if(kin===undefined)kin=(typeof P!=='undefined'&&P&&P.lineage)?P.lineage.house:null;
  const okName=n=>!NAME_BLOCK.has(n)&&(!NAME_KIN[n]||NAME_KIN[n].includes(kin));
  const g=female?'f':'m',pool=NM[cul][g].filter(okName),used=nameUsed();
  let pick=null;
  const compound=Math.random();
  if(cul==='mo'&&compound<.2){const a=R(female?MO_STEM_F:MO_STEM_M),b=R(female?MO_SUF_F:MO_SUF_M);if(a!==b){const n=a+b;if(!used.has(n)&&okName(n))pick=n;}}
  else if(cul==='cn'&&!female&&compound<.45){const n=R(CN_SUR)+R(CN_GIV);if(!used.has(n)&&okName(n))pick=n;}
  if(!pick){
    const src=pool.filter(n=>!used.has(n));
    if(src.length){
      /* 서너 후보 중 지금까지 가장 덜 쓰인 이름을 고른다 */
      let best=null;for(let i=0;i<4;i++){const c=R(src);if(best===null||(NAME_USE[c]||0)<(NAME_USE[best]||0))best=c;}
      pick=best;
    }else pick=R(pool);
  }
  NAME_USE[pick]=(NAME_USE[pick]||0)+1;NAME_RECENT.push(pick);if(NAME_RECENT.length>30)NAME_RECENT.shift();
  return pick;
}

  if(P.pol==='steppe')return P.tribe+' 유목지';

function standing(P){

  if(P.status==='captive'){const f=P.flags||{};if(f.deported||P.job==='artisan')return '포로(쓰임새를 인정받은 자)';return /인질$/.test(P.tribe||'')?'포로(인질)':'포로';}

function jobTitle(P){
  if(P.status==='slave')return '노예';
  if(P.age<14&&!P.job)return P.age<6?'어린아이':(P.female?'소녀':'소년');
  if(!P.job)return '무직';
  return titles(P,P.job)[P.lv];
}

function rollBirth(){
  const year=ri(1160,1260);
  const p={born:year,year,age:0,female:chance(.5),pol:'steppe',tribe:'',clan:'',region:'',rank:1,lineage:null,
    hp:ri(62,82),fame:0,wealth:0,sk:{ride:0,arch:0,know:0,wit:0,craft:0},job:null,lv:0,status:'free',
    spouse:null,kids:[],flags:{},done:{},log:[],dead:false,cause:'',subject:false,wives:0,parents:'',
    peakJob:null,peakLv:-1,lastOffer:0,name:''};
  if(year<1206){p.pol='steppe';p.tribe=wpick(TRIBES.map(t=>[t.id,t.w]));}
  else{
    p.pol=wpick([['mongol',44],['jin',year<=1234?24:10],['khw',year<=1231?18:8],['rus',10],['xia',year<=1227?6:2],['per',4]]);
    if(p.pol==='mongol')p.tribe=wpick(TRIBES.map(t=>[t.id,t.w]));
    else p.region=R(REGIONS[p.pol]);
  }
  if(p.tribe==='몽골족')p.clan=R(MONGOL_CLANS);
  p.rank=wpick(RANK_W[p.pol].map((w,i)=>[i,w]));
  if(p.pol==='mongol'&&year>=1206&&chance(.04)){
    p.lineage={house:R(['주치','차가타이','오고타이','툴루이']),rel:year<=1232?'아들':'손자'};
    p.rank=5;p.tribe='몽골족';p.clan='보르지긴 키야트';
  }
  if(p.rank===5&&p.tribe==='몽골족'&&p.pol!=='mongol'){p.clan='보르지긴 키야트';}
  if(year>=CONQ_YEAR[p.pol])p.subject=true;
  p.name=nameFor(cultureOf(p),p.female,p.lineage?p.lineage.house:null);
  if(p.lineage&&p.pol==='mongol'){}
  const r=p.rank;
  p.wealth=clamp([0,10,25,48,72,90][r]+ri(-4,6));
  p.fame=[0,2,8,22,40,60][r]+ri(0,5);
  for(const k in p.sk)p.sk[k]=ri(0,6);
  if(isMg(p)){p.sk.ride+=ri(2,6);p.sk.arch+=ri(0,4);}else p.sk.craft+=ri(0,4);
  if(r>=3)p.sk.know+=ri(4,9);
  if(r===2)p.sk[R(['arch','craft','wit'])]+=ri(3,6);
  if(p.lineage){for(const k in p.sk)p.sk[k]+=8;p.sk.wit+=4;}
  if(r===0){p.hp-=6;}
  p.parents=R(PARENT_JOBS[settledGroup(p)][r]);
  if(r>=3){p.job=p.female?'lady':'lord';p.lv=Math.max(0,Math.min(3,r-3));p.peakJob=p.job;p.peakLv=p.lv;}
  if(r===0)p.status='slave';
  initFamily(p);
  return p;
}

function addLog(t){t=jf(t);P.log.unshift({y:P.year,a:P.age,t});}
function recapLine(t){G.recap.lines.push(t);}
function die(cause){if(P.dead)return;P.dead=true;P.cause=cause;P.deathYear=P.year;addLog('☠ '+cause);}
function fx(o){
  for(const k in o){
    let v=o[k];if(!v)continue;
    if(k in P.sk){if(P.status==='slave'&&v>0)v=Math.ceil(v*.6);const old=P.sk[k];P.sk[k]=clamp(old+v);v=P.sk[k]-old;}
    else{const old=P[k];P[k]=clamp(old+v);v=P[k]-old;}
    if(v)G.chips.push([SKN[k],v]);
  }
  if(P.hp<=0&&!P.dead)die(P.lastCause||'기력이 다해 숨을 거두었다');
}
function setJob(j,lv){P.job=j;P.lv=lv||0;if(P.peakLv<lv||P.peakLv<0||lv>=P.peakLv){P.peakJob=j;P.peakLv=lv||0;}}

function childhood(){
  G.chips=[];const L=[];
  if(chance(.04)){die('젖먹이 시절 병을 이기지 못하고 세상을 떠났다');return sc('이른 작별','태어난 지 얼마 되지 않아 열병이 돌았다. 아이는 끝내 깨어나지 못했다.',[{t:'눈을 감는다',fn:()=>''}],'bad');}
  const pool=[
    [()=>{if(!isMg(P))return false;fx({ride:5});L.push('걸음마보다 먼저 말 등에 올라탔다. 안장 위가 가장 편한 자리였다.');return true;}],
    [()=>{fx({arch:4});L.push('형제들과 작은 활로 쥐와 새를 쏘며 놀았다.');return true;}],
    [()=>{fx({know:4});L.push('저녁마다 노인이 들려주는 조상들의 이야기와 노래를 외웠다.');return true;}],
    [()=>{fx({craft:4});L.push('어른들 곁에서 가죽을 다듬고 줄을 꼬는 법을 어깨너머로 배웠다.');return true;}],
    [()=>{fx({wit:4});L.push('낯선 사람들 사이에서 눈치껏 말하는 법을 익혔다.');return true;}],
    [()=>{fx({hp:-8});L.push('혹독한 겨울에 병치레를 오래 했지만 끝내 이겨냈다.');return true;}],
    [()=>{fx({hp:5});L.push('튼튼하게 자라 또래 중에서 가장 달리기가 빨랐다.');return true;}]
  ];
  const n=ri(2,3);const used=new Set();let guard=0;
  while(used.size<n&&guard++<20){const i=ri(0,pool.length-1);if(used.has(i))continue;if(pool[i][0]()){used.add(i);}}
  if(chance(.14)&&P.rank<5){P.flags.orphan=1;if(chance(.5))P.flags.fatherDead=1;fx({wealth:-8});L.push('여섯 해가 되기 전에 부모 중 한 사람을 잃었다. 친척 집을 전전하며 자랐다.');}
  P.age=6;P.year=P.born+6;
  addLog('여섯 살이 될 때까지 무사히 자랐다.');
  G.recap={news:NEWS[P.year]||'',lines:L,chips:G.chips.slice()};
  return null;
}

const FOCUS_DESC={
  ride:'말과 함께 달리고 길들이는 법을 익힌다',arch:'활과 화살을 만들고 과녁을 맞힌다',

};
function focusScene(){
  const opts=SK.map(([k,n])=>({t:n+' 단련',sub:FOCUS_DESC[k],fn:()=>train(k,1)}));
  opts.push({t:'휴식하며 집안일',sub:'체력을 회복한다',fn:()=>train('rest',1)});
  opts.push({t:'같은 단련으로 3년',sub:'지난 선택을 반복한다. 사건이 생기면 멈춘다',fn:()=>train(G.last,3)});
  G.scene={kind:'focus',title:'올해는 무엇에 힘쓸까',text:'',opts};
}
function train(k,times){
  G.chips=[];G.recap={news:'',lines:[],chips:[]};G.last=k;
  for(let i=0;i<times;i++){
    if(k==='rest'){fx({hp:ri(8,14)});}
    else{
      let g=ri(4,8);if(P.age<12)g=Math.ceil(g*.7);
      if(isMg(P)&&k==='ride')g+=2;
      if(P.rank>=3&&k==='know')g+=2;
      if(P.sk[k]>60)g=Math.ceil(g*.6);
      fx({[k]:g,hp:-ri(0,2)});
    }
    yearPass();
    if(P.dead||G.q.length)break;
  }
  G.recap.chips=G.chips.slice();
  nextScene();
}
function yearPass(){
  P.age++;P.year++;
  if(NEWS[P.year])G.recap.news=(G.recap.news?G.recap.news+' ':'')+NEWS[P.year];
  if(P.age<40)fx({hp:ri(1,3)});else if(P.age<55)fx({hp:ri(0,1)});
  if(P.age>40)fx({hp:-ri(0,2)});
  if(P.age>60)fx({hp:-ri(1,3)});
  if(P.job){
    const J=JOBS[P.job];fx({[R(J.key)]:ri(0,2)});
    const net=J.inc[Math.min(P.lv,J.inc.length-1)]-1.5+Math.random()-.5;
    fx({wealth:Math.round(net)});
    if(chance(.3))fx({fame:1});
  }
  family();
  ambient();
  yearNews();
  promoCheck();
  if(!P.dead)mortality();
  if(P.dead)return;
  // 사건 모으기
  for(const h of HIST){
    if(P.done[h.id])continue;
    const ys=Array.isArray(h.y)?h.y:[h.y,h.y];
    if(P.year<ys[0]||P.year>ys[1])continue;
    if(h.y2&&P.year!==ys[0]&&!chance(h.y2))continue;
    if(!h.cond(P))continue;
    P.done[h.id]=1;
    let s=h.mk(P);
    /* 6세 미만은 스스로 결정할 수 없다: 여러 갈래의 역사 선택 장면은 어른들의 결정을 따르는 한 가지 선택(첫 선택지)으로 바꾼다 */
    if(s&&P.age<6&&s.opts&&s.opts.length>1&&s.kind==='event'){const o0=s.opts[0];s=sc(s.title,s.text+'\n아직 어린 {me}은(는) 어른들의 결정을 따를 수밖에 없다.',[{t:'어른들을 따른다',sub:'아이는 스스로 결정할 수 없다',fn:o0.fn}],s.tag);}
    if(s)G.q.push(s);
  }
  if(!G.q.length){const g=pickGeneric();if(g)G.q.push(g);}
  careerCheck();
}
function mortality(){
  const a=P.age;let p=.0025+Math.pow(Math.max(0,a-38),2)*.00007;
  if(P.hp<25)p+=.06;if(P.hp<10)p+=.15;if(P.status==='slave')p+=.01;
  if(a>=92)p=1;
  if(chance(p)){
    die(a<40?'병으로 일찍 세상을 떠났다':a<60?'병과 고된 삶 끝에 눈을 감았다':'오래 살다가 평안히 세상을 떠났다');
  }
}
function family(){
  P.kids.forEach(k=>{if(!k.alive)return;k.age++;
    if(k.age<6?chance(.04):chance(.004)){k.alive=false;recapLine(`${k.name}(이)가 세상을 떠났다.`);addLog(`자녀 ${k.name}을(를) 잃었다.`);fx({hp:-6});}});
  if(P.spouse&&P.spouse.alive){
    P.spouse.age++;
    if(chance(.004+Math.pow(Math.max(0,P.spouse.age-40),2)*.00005)){P.spouse.alive=false;recapLine(`배우자 ${P.spouse.name}(이)가 세상을 떠났다.`);addLog(`배우자 ${P.spouse.name}을(를) 떠나보냈다.`);fx({hp:-8});}
    else{
      const fertile=P.female?(P.age>=16&&P.age<=40):(P.spouse.age>=16&&P.spouse.age<=40);
      if(fertile&&P.kids.filter(k=>k.alive).length<7&&chance(.24+P.wives*.05)){
        const fem=chance(.5);const kid={name:nameFor(cultureOf(P),fem),female:fem,age:0,alive:true};
        P.kids.push(kid);recapLine(`${kid.name}(${fem?'딸':'아들'})이(가) 태어났다.`);addLog(`${fem?'딸':'아들'} ${kid.name}이(가) 태어났다.`);
        if(P.female&&chance(.025)){P.lastCause='출산 후유증으로 숨을 거두었다';die(P.lastCause);}
      }
    }
  }
  if(P.age>16&&!P.dead){P.kids.forEach(k=>{});}
}
function promoCheck(){
  if(!P.job)return;const J=JOBS[P.job];
  if(P.lv>=J.max||P.status==='slave')return;
  const avg=(P.sk[J.key[0]]+P.sk[J.key[1]])/2;
  if(avg>=THRESH[P.lv+1]&&chance(.17+P.fame/500)){
    P.lv++;setJob(P.job,P.lv);fx({fame:ri(3,8)});
    const t=titles(P,P.job)[P.lv];recapLine('승진했다. 이제 '+t+'이다.');addLog('승진: '+t);
  }
}

/* ===== 진로 ===== */
function eligible(){
  const s=P.sk,L=[];
  if(P.status==='captive')return L; /* 포로는 직업·진로 제안을 받지 않는다(풀려난 뒤 careerReopen 경로로 제안) */
  if(P.status==='slave'){if(s.craft>=30)L.push('artisan');return L;}
  const man=!P.female||(s.ride+s.arch>=100);
  if(man&&(s.ride+s.arch)/2>=24)L.push('soldier');
  if(s.know>=35)L.push('admin');
  if(s.know>=28&&s.wit>=25)L.push('interp');
  if(s.know>=45&&(P.rank>=2||s.know>=55))L.push('tutor');
  if(s.craft>=28)L.push('artisan');
  if(s.wit>=36)L.push('merchant');
  if(P.rank>=3)L.push('lord');
  L.push('herder');
  return L;
}
const JOB_DESC={
  soldier:'말 위에서 싸우는 일. 전공을 쌓으면 장수가 된다',admin:'문서와 세금, 법을 다루는 관리',
  interp:'여러 나라 말을 잇는 일. 사절단에 낀다',tutor:'귀족의 자제를 가르치는 스승',
  artisan:'활·갑옷·그릇·건축 등 손기술로 먹고산다',merchant:'오르톡 상단과 함께 먼 길을 오간다',
  lord:'가문의 지위와 영지를 이어받아 다스린다',herder:'목축이나 농사로 살아간다'
};
/* 포로·노예에서 풀려난 사람에게 기존 진로 제안(careerCheck)을 다음 해에 바로 받을 수 있게 한다: 직전 제안 후 5년 대기 규칙만 풀 뿐, 직업을 복원하지 않는다 */
function careerReopen(){P.lastOffer=Math.min(P.lastOffer||0,P.age-5);}
function careerCheck(){
  if(P.dead||G.q.length||P.age<14)return;
  const L=eligible().filter(j=>j!==P.job);
  const first=!P.job;
  const better=L.filter(j=>j!=='herder');
  if(!first&&!(P.age-P.lastOffer>=5&&better.length&&(P.job==='herder')))return;
  if(first&&P.status==='slave'&&!L.length){setJob('herder',0);return;}
  if(!L.length){if(first)setJob('herder',0);return;}
  P.lastOffer=P.age;
  const opts=L.map(j=>({t:JOBS[j].name,sub:(j==='maid'&&!isMg(P))?'귀부인이나 귀족 가문의 안주인을 곁에서 모신다':JOB_DESC[j],fn:()=>{setJob(j,0);fx({fame:1});addLog('진로: '+JOBS[j].name+'의 길에 들어섰다.');return `${JOBS[j].name}의 길을 걷기로 했다. 첫 직함은 ${titles(P,j)[0]}.`;}}));
  if(!first)opts.push({t:'지금처럼 산다',sub:'',fn:()=>'지금의 삶을 이어가기로 했다.'});
  G.q.push(sc(first?'진로를 정할 나이':'새로운 길이 열렸다',first?'어른으로 대접받는 나이가 되었다. 그동안 갈고닦은 능력에 따라 몇 갈래 길이 보인다.':'그동안 쌓은 실력을 알아본 사람들이 새로운 일을 권한다.',opts,'진로'));
}

/* ===== 장면 진행 ===== */
function nextScene(){
  if(P.dead){showEnd();return;}
  while(G.q.length){
    const s=G.q.shift();const sc2=typeof s==='function'?s():s;
    if(!sc2)continue;
    if(sc2.kin&&!sibReach(sc2.kin))continue; if(sc2.vis&&!wedVisitLive(sc2.vis))continue; /* 혼인한 가족의 방문 장면: 기다리는 사이 사망·소식 끊김·헤어짐이 있으면 건너뜀 */ /* 대기열에서 기다리는 사이 연락이 끊긴 가족과의 직접 만남 장면은 건너뜀 */
    G.scene=sc2;return;
  }
  focusScene();
}
function choose(i){
  const s=G.scene;if(!s)return;
  if(s.kind==='birth'){const c=childhood();if(c){G.scene=c;return;}G.scene=null;nextScene();return;}
  if(s.kind==='result'){nextScene();return;}
  if(s.kind==='focus'){s.opts[i].fn();return;}
  if(s.kind==='end')return;
  G.chips=[];
  const o=s.opts[i];let r=o.fn?o.fn(P):'';let next=null;
  if(r&&typeof r==='object'){next=r.next;r=r.text;}
  if(r){addLog(r.split('\n')[0]);}
  if(next)G.q.unshift(next);
  G.scene={kind:'result',title:s.title,text:r||'',chips:G.chips.slice(),tag:s.tag,opts:[{t:P.dead?'삶을 돌아본다':'다음',fn:null}]};
}

/* ===== 엔딩 ===== */
function epitaph(){
  if(P.flags.khan)return '대칸의 자리에 오른 자';
  const j=P.peakJob,l=P.peakLv;
  if(j==='soldier'&&l>=4)return '초원을 달린 만호장';
  if(j==='soldier'&&l>=3)return '이름난 천호장';
  if(j==='soldier'&&l>=2)return '용맹한 백호장';
  if(j==='admin'&&l>=3)return '제국의 재상';
  if(j==='admin'&&l>=2)return '다루가치로 이름을 남긴 관리';
  if(j==='tutor'&&l>=3)return '제국의 대스승';
  if(j==='tutor'&&l>=2)return '왕자들의 스승';
  if(j==='interp'&&l>=2)return '여러 나라 말을 잇던 통역관';
  if(j==='artisan'&&l>=3)return '궁정의 수석 장인';
  if(j==='artisan'&&l>=2)return '이름난 명장';
  if(j==='merchant'&&l>=3)return '대륙을 오간 거상';
  if(j==='lord'&&l>=3)return '한 시대를 이끈 지배자';

  if(P.age<20)return '피어보지 못한 이름';

}
function calcScore(){
  const maxSk=Math.max(...Object.values(P.sk));
  const kids=P.kids.filter(k=>k.alive).length;
  let s=P.fame*1.2+P.wealth*.4+Math.max(0,P.peakLv)*12+kids*4+maxSk*.6+P.age*.4+(P.lineage?10:0)+(P.flags.khan?100:0);
  return Math.round(s);
}
function showEnd(){
  const s=calcScore();
  const g=s>=190?'S':s>=140?'A':s>=95?'B':s>=55?'C':'D';
  G.scene={kind:'end',title:epitaph(),score:s,grade:g};
}
/* ===== 정복·포로 시스템 ===== */
function loseWealth(f){fx({wealth:-Math.round(P.wealth*f)});}

/* 약탈혼 장면 */
/* 약탈혼으로 시집간 여성: 친정 형제자매 가운데 함께 끌려오지 않은 사람은 곁에 없는 사람으로 둔다(away). 이벤트·상속 장면의 '곁에 있는 형제' 후보에서 빠진다. 삭제하지 않는다. */
function raidSettle(){
  /* 친정 가족(부모·형제자매)과 소식이 끊긴다: away+apart='raid', 끊기던 때의 나이·연도를 known 에 남긴다. 가족 자체와 가계도 관계는 지우지 않는다.
     이후 생사·근황은 kinNews()(v3a.js)로 뒤늦게 전해질 때만 알려진다. 함께 끌려온(warTogether)·소식이 끊긴(lost)·이미 죽은 사람은 그대로. */
  const cut=o=>{if(o&&o.alive&&!o.lost&&!o.away&&!o.warTogether){o.away=true;o.apart='raid';o.known={age:o.age,year:P.year};}};
  (P.sibs||[]).forEach(cut);cut(P.father);cut(P.mother);
}
/* tribe: 초원 부족 간 습격이면 습격한 부족 이름('타타르' 등). 남편 부족으로 삼아 기존 tribeHook 이 거주 부족을 옮기게 한다 */
function raidSpouseTribe(t){if(!t)return null;return MONGOL_CLANS.includes(t)?'몽골족('+t+')':t+'족';}
/* 약탈혼 뒤의 현재 위치: 출신(bornInfo·birthTribe)은 그대로 두고 현재 거주만 옮긴다.
   초원 부족 간 습격이면 남편 부족(tribe)을, 몽골 장수가 맡은 포로라면 몽골족을 남편 부족으로 삼아 기존 tribeHook 이 거주 부족을 옮기게 한다.
   초원 밖 출신은 기존처럼 몽골 땅(pol='mongol')으로 옮긴다. */
function raidHomeMove(tribe){
  const old=P.pol;
  if(old!=='steppe'){P.pol='mongol';P.tribe=(POLNAME[old]||'')+' 출신';P.region='';}
}
const raidSpouseTribe2=(tribe,old)=>raidSpouseTribe(tribe)||(old==='steppe'?'몽골족':'몽골 제국');
function raidMarriage(captor,place,tribe){
  return sc('약탈혼',`${place}에서 끌려온 사람들 가운데 당신이 눈에 띄었다. ${captor}의 천막으로 끌려가 아내가 되라는 말을 들었다. 초원에서는 오래된 풍습이지만, 당신에게는 하루아침에 모든 것이 바뀐 일이다.`,[
    {t:'받아들이고 새 삶을 꾸린다',sub:'살아남아 가정을 이룬다',fn:()=>{
      const old=P.pol;const hb=v16raidPrev();
      P.spouse={name:nameFor('mo',false,null),age:P.age+ri(-3,8),alive:true,origin:'약탈혼',since:P.year,female:false,tribe:raidSpouseTribe2(tribe,old),desc:tribe?'습격한 부족의 전사':'몽골의 장교',rank:2};v16raidMark(hb);
      raidHomeMove(tribe);
      P.status='free';P.rank=2;P.flags.raided=1;
      setJob('herder',0);fx({hp:-5,fame:3,wealth:ri(4,10)});raidSettle();const th=tribeHook();
      return (th?th+'\n':'')+`당신은 ${P.spouse.name}의 아내가 되었다. 처음엔 눈물뿐이었지만, 몽골 천막의 안주인으로서 가축과 살림을 맡으며 자리를 잡아 갔다. 약탈로 시작된 인연에서 아이들이 태어날 것이다.`;}},
    {t:'기회를 보아 도망친다',sub:'성공은 거의 불가능하다. 실패하면 혹독한 대가',fn:()=>{
      if(chance(.012+(P.sk.wit+P.sk.ride)/9000)){P.status='free';P.flags.refugee=1;P.wealth=0;fx({hp:-10,wit:3});
        return '달 없는 밤, 말 한 필을 훔쳐 천막을 빠져나갔다. 이틀 밤낮을 달린 끝에 겨우 추격을 따돌렸다. 가진 것은 없지만 자유의 몸이다.';}
      fx({hp:-18});
      if(chance(.5)){P.status='slave';P.rank=0;setJob('herder',0);P.wealth=0;raidSlaveMove(tribe);return '붙잡혀 심하게 매질을 당했다. 이제 아내가 아닌 노예로 팔려 가 가장 천한 일을 하게 되었다.'+slaveKinSettle(place);}
      const old2=P.pol;const hb2=v16raidPrev();P.spouse={name:nameFor('mo',false,null),age:P.age+ri(-3,8),alive:true,origin:'약탈혼',since:P.year,female:false,tribe:raidSpouseTribe2(tribe,old2),desc:tribe?'습격한 부족의 전사':'몽골의 장교',rank:2};v16raidMark(hb2);if(!tribe)raidHomeMove(tribe);P.status='free';P.rank=2;setJob('herder',0);raidSettle();tribeHook();
      return `붙잡혀 매질을 당했고, 결국 ${P.spouse.name}의 아내로 살게 되었다. 이번에는 아무도 말려 주지 않았다.`;}}
  ],'약탈혼');
}

/* 노예가 되었을 때 가족의 행방: 이미 다른 기록이 있는 사람(사망·실종·헤어짐·함께 끌려옴·소식 끊김)은 건드리지 않고,
   아직 아무 기록이 없는 가족만 각자의 처지(나이·성별·혼인으로 따로 사는지)에 따라 네 가지로 가른다. 모두 함께 노예가 되었다고 두지 않는다.
   together=함께 끌려와 곁에 있음 / lost=끌려가다 흩어져 소식이 끊김(생사 불명) / dead=난리 중 희생 / stayed=기존 거처에 남음(소식 끊김, 살아 있음).
   남은 부모·형제자매는 약탈혼의 친정 식구와 같은 방식(away+apart='raid'+known)이라 이후 소식(kinNews)과 가계도 표시도 같다.
   남은 배우자·자녀는 apart='left' 로 표시해 '곁에 없는 사람'이 된다(함께 지내는 장면에서 빠진다). 텍스트는 가족 줄 형식('관계 이름: 상태')을 따른다. */
function slaveKinSettle(place){
  const rows=[];
  const add=(o,lab,kind)=>{if(o&&o.alive&&!o.lost&&!o.away&&!o.apart&&!o.warTogether&&!o.hidden)rows.push({o,lab,kind});};
  add(P.spouse,'배우자','sp');
  (P.kids||[]).forEach(k=>add(k,k.female?'딸':'아들','kid'));
  (P.sibs||[]).forEach(s=>add(s,sibWord(s),'sib'));
  add(P.father,'아버지','par');add(P.mother,'어머니','par');
  const lines=[];
  rows.forEach(({o,lab,kind})=>{
    const a=o.age||0;
    /* [함께, 흩어짐, 희생, 남음] */
    let w;
    if(kind==='sp'&&o.absent||kind!=='sp'&&o.wed)w=[0,.1,.05,.85]; /* 이미 따로 살던 사람(출정 중인 배우자·혼인해 나간 형제자매와 자녀) */
    else if(a<=13)w=[.7,.3,0,0];
    else if(a>=55)w=[.2,.2,.3,.3];
    else if(o.female)w=[.4,.25,.1,.25];
    else w=[.25,.25,.25,.25];
    let r=Math.random()*w.reduce((s,x)=>s+x,0),i=0;for(;i<w.length-1;i++){r-=w[i];if(r<0)break;}
    const nm=lab+' '+o.name;
    if(i===0){warFamMark(o,lab,'together',place);lines.push(nm+': 함께 끌려와 곁에 있음(생존)');}
    else if(i===1){warFamMark(o,lab,'lost',place,'끌려가던 길에 흩어져 소식이 끊김');lines.push(nm+': 끌려가던 길에 흩어져 소식이 끊김');}
    else if(i===2){warFamMark(o,lab,'dead',place);lines.push(nm+': '+place+' 중 희생');}
    else{
      o.away=true;o.apart=(kind==='sp'||kind==='kid')?'left':'raid';o.known={age:a,year:P.year,stay:1};
      if(o.absent&&typeof t5end==='function')t5end(P,'status');
      const t=nm+': 기존 거처에 남음(소식이 끊겨 근황을 알 수 없음)';
      addLog(t);recapLine(t);lines.push(t);
    }
  });
  if(!lines.length)return '';
  const n=Math.min(lines.length,6);
  return '\n'+lines.slice(0,n).join('\n')+(lines.length>n?'\n그 밖에도 '+(lines.length-n)+'명의 소식이 갈렸다.':'');
}
/* 플레이어가 혼자(또는 일부와) 다른 곳으로 옮겨 갈 때 가족의 동행·잔류를 정한다(기술자 징발·투항·난민 도피·포로 등).
   전쟁 중 사망·실종·포로 판정(warFamMark/v9familyFate)이 끝난 뒤, 아직 아무 상태가 정해지지 않은 가족만 대상으로 한다. 새 사망·실종은 만들지 않는다.
   대상 제외: 사망·소식 끊김(lost)·포로(captive)·이미 곁에 없음(away/apart)·함께 끌려옴(warTogether)·아직 모르는 새 식구(hidden)·출정 중(absent)·혼인한 자녀/형제자매.
   판정: 배우자(+부인)와 미성년(18세 미만) 자녀는 한 가구로 한 번(pTogether 확률로 함께, 아니면 모두 남음). 부모·형제자매·성인 자녀는 각자 따로 같은 확률.
   함께 이동: warTogether 표시(곁에 있음). 남음: away + apart('left'=배우자·자녀 / 'raid'=부모·형제자매, 이후 소식 kinNews 가 전함) + known{age,year,stay:1}. */
function kinMoveSettle(pTogether){
  const ok=o=>!!o&&o.alive&&!o.lost&&!o.away&&!o.apart&&!o.warTogether&&!o.hidden&&!o.captive&&!o.absent&&!o.pend&&!o.wed;
  const lines=[];
  const settle=(o,lab,kind,together)=>{
    const nm=lab+' '+o.name;
    if(together){o.warTogether=P.year;lines.push(nm+': 함께 이동해 곁에 있음(생존)');return;}
    o.away=true;o.apart=(kind==='sp'||kind==='kid')?'left':'raid';o.known={age:o.age||0,year:P.year,stay:1};
    const t=nm+': 기존 거처에 남음(소식이 끊겨 근황을 알 수 없음)';addLog(t);recapLine(t);lines.push(t);
  };
  const hh=[];
  [P.spouse].concat(P.cowives||[]).forEach(w=>{if(ok(w))hh.push([w,w===P.spouse?'배우자':'부인','sp']);});
  (P.kids||[]).forEach(k=>{if(ok(k)&&(k.age||0)<18)hh.push([k,k.female?'딸':'아들','kid']);});
  if(hh.length){const tg=chance(pTogether);hh.forEach(([o,lab,kind])=>settle(o,lab,kind,tg));}
  (P.kids||[]).forEach(k=>{if(ok(k)&&(k.age||0)>=18)settle(k,k.female?'딸':'아들','kid',chance(pTogether));});
  (P.sibs||[]).forEach(s=>{if(ok(s))settle(s,sibWord(s),'sib',chance(pTogether));});
  [[P.father,'아버지'],[P.mother,'어머니']].forEach(([o,lab])=>{if(ok(o))settle(o,lab,'par',chance(pTogether));});
  if(!lines.length)return '';
  const n=Math.min(lines.length,6);
  return '\n'+lines.slice(0,n).join('\n')+(lines.length>n?'\n그 밖에도 '+(lines.length-n)+'명의 거처가 갈렸다.':'');
}
/* 포로 처분 (how: surrender | captured). local=true면 초원 부족 간 싸움 */
function fate(how,place,opt){
  opt=opt||{};
  if(how==='captured'){
    let pd=.4-(P.sk.wit+P.hp/2)/400-((P.sk.craft>=35||P.sk.know>=40)?.12:0)+(P.age>50?.1:0)-((P.female&&P.age<40)?.1:0)+(opt.massacre||0);
    if(P.rank>=4)pd+=.25;
    if(chance(clamp(pd,.08,.8))){P.lastCause=`${place}에서 학살 속에 목숨을 잃었다`;fx({hp:-100});
      return `${place}이(가) 무너졌다. 칼과 불길이 휩쓸고 지나갔다. 당신은 끝내 살아남지 못했다.`;}
  }
  const old=P.pol;
  P.subject=true;P.flags.conquered=1;P.flags.survivor=1;
  if(P.age<14&&(opt.local)&&chance(.3)){
    P.status='free';P.rank=2;fx({fame:8,know:6,wealth:6});
    return '부모를 잃은 아이로 끌려왔지만, 대칸의 어머니 후엘룬이 거두어 양자로 삼았다. 그 천막에서 글과 말을 배우며 자란다.';
  }
  if(!opt.local&&(P.sk.craft>=35||(P.job==='smith'&&P.sk.craft>=30))&&chance(.75)){
    const _cf=capFrom();P.pol='mongol';P.tribe=POLNAME[old]+'계 포로';P.region='';P.status='captive';P.rank=1;capMark('deport',_cf);
    const _sm=P.job==='smith'; /* 대장장이는 금속 장인 그대로 징발(직업을 기술자로 바꾸지 않는다) */
    setJob(_sm?'smith':'artisan',0);P.wealth=ri(0,8);P.flags.deported=1;fx({fame:-3});
    if(P.job==='artisan')addLog('몽골에 징발되어 '+titles(P,P.job)[P.lv]+'의 일을 하게 되었다.');
    else if(P.job==='smith')addLog('몽골에 징발되어 쇠를 다루는 장인의 일을 하게 되었다.');
    return `몽골군은 ${P.job==='smith'?'쇠를 다루는 장인을':(P.job==='artisan'?'기술자':'솜씨 있는 사람')+'를'} 가려내 목숨을 살려 두었다. 당신은 줄에 묶인 채 수레에 실려 먼 동쪽 몽골 본토로 끌려갔다. 가족과 고향은 두 번 볼 수 없을 것이다.`+kinMoveSettle(.3);
  }
  if(!opt.local&&P.sk.know>=40&&chance(.6)){
    const j=P.sk.wit>=30?'interp':'admin';
    setJob(j,0);P.status='free';fx({fame:2});
    if(P.job===j){addLog('몽골 관리에게 발탁되어 '+titles(P,P.job)[P.lv]+'이(가) 되었다.');
      return `글을 읽고 셈할 줄 아는 사람이 드물어, 몽골 관리가 당신을 눈여겨보았다. 목숨은 물론 ${JOBS[j].name}의 자리까지 얻었다(직함: ${titles(P,P.job)[P.lv]}). 고향 사람들은 당신을 두고 수군거릴 것이다.`;}
    return `글을 읽고 셈할 줄 아는 사람이 드물어, 몽골 관리가 당신을 눈여겨보았다. 목숨을 부지하고 집안일을 맡아 살게 되었다. 고향 사람들은 당신을 두고 수군거릴 것이다.`;
  }
  if(P.female&&P.age>=13&&P.age<=38&&chance(how==='captured'?.65:.35)){
    return {text:'몽골 장수들이 포로 가운데 여자를 고르기 시작했다. 당신에게 손가락이 향했다.',next:raidMarriage(R(['한 천호장','부유한 노욘','이름난 전사']),place)};
  }
  if(P.rank>=3&&how==='surrender'){
    loseWealth(.3);fx({fame:-4});P.status='free';
    return '항복의 대가로 가문의 재산 일부와 아들딸의 인질을 바쳤다. 그러나 몽골은 가문의 지위를 인정하고 지방 통치를 맡겼다. 살아남았다.';
  }
  if(how==='captured'||chance(.25)){
    P.status='slave';P.rank=0;setJob('herder',0);P.wealth=0;fx({hp:-8});
    if(!opt.local&&old!=='mongol'){P.pol='mongol';P.tribe=(POLNAME[old]||'')+'계 노예';P.region='';} /* 글 그대로 몽골 가문으로 끌려갔으니 현재 위치를 옮긴다(초원 안의 싸움은 기존대로). 출신 정보는 그대로 */
    return '포로의 대열에 묶여 끌려갔다. 어느 몽골 가문에 노예로 넘겨져 천막 바깥에서 가축을 돌보며 산다. 이름은 불리지 않는다.'+slaveKinSettle(place);
  }
  loseWealth(.5);fx({hp:-3});
  return '몽골은 공물과 세금을 정한 뒤 병사를 거두었다. 가진 것의 절반을 내놓았지만 집과 목숨은 지켰다.';
}

function sc_child(place,how){
  return sc('어른들의 결정',`${place}에서 전쟁이 닥쳤다. 아직 어린 당신은 어른들의 손에 이끌려 다닐 뿐이었다.`,[{t:'어른들을 따른다',fn:()=>{
    if(how==='captured'&&chance(.35)){P.lastCause='전란 속에서 목숨을 잃었다';fx({hp:-100});return '전란 속에서 어른들과 함께 길을 잃었다. 끝내 돌아오지 못했다.';}
    if(chance(.5)){fx({hp:-6,wealth:-6});P.flags.survivor=1;return fate('surrender',place,{local:P.pol==='steppe'});}
    return fate(how,place,{local:P.pol==='steppe'});}}],'전란');
}

function v105stable(){
  if(typeof P==='undefined'||!P)return false;
  const f=P.flags||{};
  if(P.status==='slave'||P.status==='captive'||P.master)return false;             /* 예속·포로 */
  if(P.wealth<50&&(f.refugee||f.exiled||f.conquered||f.survivor))return false;    /* 난민·유배·정복·전란(과거 표식은 평생 남으므로 재산이 넉넉하면 현재 생활 기준으로 판단) */
  if(f.famine_year&&f.famine_year>=P.year-1)return false;                          /* 최근 흉년·조드 */
  if(P.wealth<15)return false;                                                     /* 생계 곤란 */
  return P.rank>=3||P.wealth>=50;                                                  /* 상류층 */
}
function causeFor(age,female){
  if(age<10){const c=R(CAUSE.child);return c==='굶주림'&&v105stable()?'열병':c;}
  if(age>=60)return R(CAUSE.old);
  if(female&&age>=16&&age<=40&&chance(.3))return '난산';
  const c=R(CAUSE.adult);return c==='굶주림'&&v105stable()?'오랜 병환':c;
}

function jobTitle(P){
  if(P.status==='slave')return '노예';
  if(P.age<15&&(!P.job||P.job==='lord'||P.job==='lady'))return P.age<6?'어린아이':(P.rank>=3?(P.female?'귀한 집 딸':'귀한 집 아들'):(P.female?'소녀':'소년'));
  if(!P.job)return '무직';
  if(P.job==='lord'&&P.lv>=1&&!v9leadOk(P))return titles(P,'lord')[0];
  if(P.flags&&P.flags.retired&&P.age>=60)return titles(P,P.job)[P.lv]+'(집안의 어른)';

}

const JOBACT={
  lord:['영지를 돌보고 사람을 다스린다',['wit','know']],soldier:['부대 훈련에 힘쓴다',['ride','arch']],admin:['문서와 장부를 정리한다',['know','wit']],
  interp:['외국어를 익히고 통역 일을 한다',['know','wit']],tutor:['제자를 가르친다',['know','wit']],artisan:['공방에서 작품을 만든다',['craft','know']],
  merchant:['장사에 힘쓴다',['wit','craft']],herder:['가축과 농사를 돌본다',['ride','craft']],lady:['집안 살림과 인맥을 챙긴다',['wit','know']]
};
function focusScene(){
  const a=P.age,sl=P.status==='slave';
  const lab={
    ride:a<12?'말 타며 놀기':a<50?'기마 단련':'말 다루는 감을 지킨다',
    arch:a<12?'활 쏘기 놀이':a<50?'궁술 단련':'활 솜씨를 지킨다',
    know:a<12?'어른들 이야기 듣기':a<50?'학문과 견문':'지혜를 정리한다',
    wit:a<12?'눈치 기르기':a<50?'사람 사귀기':'사람 사이를 조율한다',
    craft:a<12?'손으로 만들기 놀이':a<50?'기술 연마':'숙련된 손놀림을 지킨다'
  };
  let opts=[];
  if(sl){
    opts=[{t:'말과 가축을 돌본다',sub:'기마',fn:()=>train('ride',1)},{t:'주어진 일을 한다',sub:'기술',fn:()=>train('craft',1)},{t:'틈틈이 어깨너머로 공부한다',sub:'지식',fn:()=>train('know',1)}];
  }else{
    opts=SK.map(([k])=>({t:lab[k],sub:FOCUS_DESC[k],fn:()=>train(k,1)}));
    if(P.job&&a>=15)opts.push({t:JOBACT[P.job][0],sub:'직업에 힘쓴다 · '+JOBACT[P.job][1].map(k=>SKN[k]).join('·'),fn:()=>train('job',1)});
    if(a>=50)opts.push({t:'자손과 제자를 가르친다',sub:'평생의 경험을 전한다',fn:()=>train('teach',1)});
    if(a>=60)opts.push({t:'지난날을 돌아보며 기도한다',sub:'마음과 몸을 가다듬는다',fn:()=>train('faith',1)});
  }
  opts.push({t:'쉬면서 집안일',sub:'체력을 회복한다',fn:()=>train('rest',1)});
  opts.push({t:'같은 일로 3년',sub:'지난 선택을 반복한다. 사건이 생기면 멈춘다',fn:()=>train(G.last,3)});
  G.scene={kind:'focus',title:'올해는 무엇에 힘쓸까',text:'',opts};
}
function trainGain(k){
  let g=ri(4,8);
  if(P.age<12)g=Math.ceil(g*.7);
  if(isMg(P)&&k==='ride')g+=2;
  if(P.rank>=3&&k==='know')g+=2;
  const t=TEMPER[P.temper];if(t&&t.m[k])g=Math.round(g*t.m[k]);
  if(P.sk[k]>60)g=Math.ceil(g*.6);
  if(P.age>=50&&(k==='ride'||k==='arch'||k==='craft'))g=Math.ceil(g*.5);
  if(P.age>=65)g=Math.ceil(g*.6);
  return g;
}
function train(k,times){
  G.chips=[];G.recap={news:'',lines:[],chips:[]};G.last=k;
  const kk=(k==='job'&&!P.job)?'rest':k;
  for(let i=0;i<times;i++){
    if(kk==='rest'){fx({hp:ri(8,14)});}
    else if(kk==='job'){const J=JOBACT[P.job][1];const o={};J.forEach(s=>o[s]=Math.max(2,Math.round(trainGain(s)*.8)));o.hp=-ri(0,2);o.wealth=chance(.5)?1:0;if(chance(.4))o.fame=1;fx(o);}
    else if(kk==='teach'){fx({wit:3,fame:2,hp:-1});recapLine(v47gkHome(P)?'자식과 손주들을 앉혀 놓고 평생 배운 것을 가르쳤다.':P.kids.some(x=>x.alive&&!wedOut(x))?'자식들을 앉혀 놓고 평생 배운 것을 가르쳤다.':'제자와 이웃의 젊은이들에게 평생 배운 것을 나누어 주었다.');}
    else if(kk==='faith'){fx({hp:ri(3,6),wit:2,fame:1});recapLine('조용히 기도하며 지난날의 사람들을 하나하나 떠올렸다.');}
    else{
      fx({[kk]:trainGain(kk),hp:-ri(0,2)+(P.temper==='sturdy'?1:0)});
    }
    yearPass();
    if(P.dead||G.q.length)break;
  }
  G.recap.chips=G.chips.slice();
  nextScene();
}

/* ===== 직업 자격 (여성 제약) ===== */
function eligible(){
  const s=P.sk,L=[];
  if(P.status==='slave')return [];
  const f=P.female;
  const rs=s.ride+s.arch;
  if(!f&&rs/2>=24)L.push('soldier');
  else if(f&&rs>=120&&chance(.012+(rs-120)/2500))L.push('soldier');
  if(!f&&s.know>=35)L.push('admin');
  else if(f&&s.know>=60&&chance(.025+(s.know-60)/700))L.push('admin');
  if(!f&&s.know>=28&&s.wit>=25)L.push('interp');
  else if(f&&s.know>=40&&s.wit>=35&&chance(.3))L.push('interp');
  if(s.know>=45&&(P.rank>=2||s.know>=55)&&(!f||chance(.7)))L.push('tutor');
  if(s.craft>=28)L.push('artisan');
  if(s.wit>=36&&(!f||chance(.6)))L.push('merchant');
  if(P.rank>=3)L.push(f?'lady':'lord');
  L.push('herder');
  return L;
}
function promoCheck(){
  if(!P.job)return;const J=JOBS[P.job];
  if(P.lv>=J.max||P.status==='slave')return;
  const avg=(P.sk[J.key[0]]+P.sk[J.key[1]])/2;
  let p=.17+P.fame/500;
  if(P.female&&(P.job==='soldier'||P.job==='admin'))p*=.3;
  if(avg>=THRESH[P.lv+1]&&chance(p)){
    P.lv++;setJob(P.job,P.lv);fx({fame:ri(3,8)});
    const t=titles(P,P.job)[P.lv];recapLine(jf("{me}의 성실함이 인정받아 '"+t+"'의 자리에 올랐다."));addLog("'"+t+"'(으)로 승진했다.");
  }else if(avg>=THRESH[P.lv+1]&&!(P.promoQ>=P.year-2)){
    /* 승진 요건은 갖췄으나 이번 해엔 오르지 못함: 마누스 문구, 3년에 한 번만 */
    P.promoQ=P.year;recapLine(jf('{me}은(는) 맡은 일을 성실히 해 나갔다. 눈에 띄는 승진은 없었지만 쌓아 온 경력이 한 줄 더 늘었다.'));
  }
}

function bear(mother){

      if(chance(.4)){bear(mother);return '미루려 했지만 하늘의 뜻은 달랐다. 아이는 결국 태어났다.';}

}
function levirate(){

function kidWedScene(k){

function withConsult(s){

function family(){
  const C=cultureOf(P);
  P.cowives=P.cowives||[];
  fixSpouse(P.spouse);P.cowives.forEach(fixSpouse);
  /* 자녀 */
  P.kids.forEach(k=>{
    if(!k.alive)return;k.age++;k.kids=k.kids||[];
    if(k.pend)return; /* 곁을 떠나 소식이 끊긴 자녀의 죽음은 이미 정해졌으나 아직 전해지지 않았다(kinNews 가 전한다) */
    const pd=k.age<6?(k.care?.025:.04):(.004+Math.pow(Math.max(0,k.age-45),2)*.00006);
    if(chance(pd)){
      if(k.apart==='left'){k.pend={y:P.year,cause:causeFor(k.age,k.female)};return;} /* 소식이 끊긴 채 곁에 없는 자녀: 사망을 곧바로 알리지 않고, 알게 되는 순간까지 미룬다 */
      k.alive=false;k.cause=causeFor(k.age,k.female);recapLine(`${k.name}(이)가 ${ro(k.cause)} 세상을 떠났다.`);addLog(`${k.female?'딸':'아들'} ${k.name}을(를) ${ro(k.cause)} 잃었다.`);fx({hp:-6});return;}
    /* 손주 */
    k.kids.forEach(g=>{if(!g.alive)return;g.age++;
      if(chance(g.age<6?.04:.004)){g.alive=false;g.cause=causeFor(g.age,g.female);
        if(v47far(k)){recapLine(`${k.name}의 ${g.female?'딸':'아들'} ${g.name}(이)가 ${ro(g.cause)} 세상을 떠났다는 소식이 전해졌다.`);addLog(`손${g.female?'녀':'자'} ${g.name}의 부음을 전해 들었다.`);} /* 시집가거나 따로 사는 자녀의 아이: 곁에서 겪은 일이 아니라 소식으로 */
        else{recapLine(`손${g.female?'녀':'자'} ${g.name}(이)가 ${ro(g.cause)} 세상을 떠났다.`);addLog(`손${g.female?'녀':'자'} ${g.name}을(를) 잃었다.`);}}});
    if(k.wed&&k.age>=15&&k.age<=42&&k.kids.length<5&&chance(.17)){
      const f=chance(.5);const g={name:nameFor((typeof nameCul==='function'&&nameCul(k.female?(k.inlaw&&k.inlaw.name):k.name))||C,f),female:f,age:0,alive:true};k.kids.push(g);
      if(v47far(k)){recapLine(`${k.name}이(가) ${f?'딸':'아들'} ${g.name}을(를) 낳았다는 소식이 인편으로 닿았다. 손${f?'녀':'자'}를 얻었으나 아직 얼굴은 보지 못했다.`);addLog(`손${f?'녀':'자'} ${g.name}이(가) 태어났다는 소식을 들었다.`);} /* 시집가거나 따로 사는 자녀의 아이: 소식으로 */
      else{recapLine(`${k.name}의 ${f?'딸':'아들'} ${g.name}이(가) 태어났다. 손${f?'녀':'자'}를 보았다.`);addLog(`손${f?'녀':'자'} ${g.name}이(가) 태어났다.`);}
      fx({fame:1,hp:2});
    }
    /* 약혼한 자녀의 혼인 */
    if(k.betrothal){const bs=betrothalDue(k);if(bs)G.q.push(bs);}
    /* 혼사 */
    if(!k.wed&&!k.sched&&!kidAway(k)&&k.age>=14&&(k.age>=20||chance(.35))){k.sched=1;G.q.push(kidWedScene(k));}
  });
  if(typeof capSchedule==='function')capSchedule();
  /* 배우자 */
  allWives().forEach(w=>{
    if(!w.alive)return;w.age++;
    if(w.pend)return; /* 곁에 없는 배우자의 죽음은 정해졌으나 아직 전해지지 않았다(kinNews) */
    if(chance(.004+Math.pow(Math.max(0,w.age-40),2)*.00005)){

  const mothers=P.female?(P.spouse&&P.spouse.alive&&!P.spouse.apart&&P.age>=16&&P.age<=40?[P.name]:(typeof concFather==='function'&&concFather()&&P.age>=16&&P.age<=40?[P.name]:[])):liveWives().filter(w=>w.apart!=='sold'&&w.age>=16&&w.age<=40).map(w=>w.name);

  if(living<8)mothers.forEach(m=>{if(!P.dead)conceive(m);});

/* ===== 선택 처리 (상의 기능 포함) ===== */
function choose(i){
  const s=G.scene;if(!s)return;
  if(s.kind==='birth'){const c=childhood();if(c){G.scene=c;return;}G.scene=null;nextScene();return;}
  if(s.kind==='result'){nextScene();return;}
  if(s.kind==='focus'){s.opts[i].fn();return;}
  if(s.kind==='end')return;
  const o=s.opts[i];
  if(o.consult){
    const others=s.opts.map((x,j)=>j).filter(j=>j!==i&&!s.opts[j].consult);
    const rj=R(others);s.opts.splice(i,1);
    const rec=s.opts[rj>i?rj-1:rj];rec.adv=1;
    const w=P.spouse.name;
    s.note=R([`${w}이(가) 잠시 생각하더니 말했다. "${rec.t} 쪽이 낫겠어요. 아이들과 우리 식구를 먼저 생각하세요."`,`${w}이(가) 조용히 말했다. "${rec.t} 쪽이 맞다고 봐요. 하지만 결정은 당신이 하세요."`,`${w}이(가) 손을 잡으며 말했다. "나는 ${rec.t} 쪽에 마음이 가요."`]);
    rec.t='★ '+rec.t;return;
  }
  G.chips=[];G.bonus=o.adv?.12:0;
  let r=o.fn?o.fn(P):'';let next=null;
  G.bonus=0;
  if(r&&typeof r==='object'){next=r.next;r=r.text;}
  if(r){addLog(r.split('\n')[0]);}
  if(o.adv&&r)r+='\n(아내의 조언을 따랐다.)';
  if(next)G.q.unshift(next);
  G.scene={kind:'result',title:s.title,text:r||'',chips:G.chips.slice(),tag:s.tag,opts:[{t:P.dead?'삶을 돌아본다':'다음',fn:null}]};
}

/* ===== v2b: 전쟁 장면 재작성, 정치, 새 이벤트 ===== */
function siegeScene(o){
  const place=o.place,local=!!o.local;
  if(P.age<=13||(P.rank>=3&&P.age<15&&!P.flags.fatherDead))return sc_child(place,(o.hold||.5)>.5?'captured':'surrender');
  const head=!P.female&&P.rank>=3;
  const cityResist=!head&&chance(o.hold||.5);
  const hw=local?'부족장':'성주';
  const stat=local?(cityResist?`${hw}은(는) 끝까지 싸우기로 했다. 천막촌의 남자들이 말에 올랐다.`:`${hw}은(는) 항복을 택했다. 천막촌 앞에 무릎을 꿇으려 한다.`)
    :(cityResist?'성주는 끝까지 싸우기로 했다. 사람들이 성벽으로 끌려 나갔다.':'성주는 항복을 택했다. 성문이 열리려 한다.');
  const tail='\n\n몽골의 사자가 외쳤다. "항복하면 목숨을 살려 주겠다. 거부하면 한 사람도 남기지 않겠다."';
  const nomad=local||isMg(P);
  const massacre=o.massacre;
  const res=(pre,t)=>typeof t==='string'?pre+'\n'+t:{text:pre,next:t.next};
  /* 패전·항복 때 아내·딸·어머니가 포로가 될 수 있다(가족 운명 기록 v9familyFate 를 재사용, 같은 해 같은 장소는 한 번만) */
  const famW=sev=>warWomenFate(place,sev);
  const cap=pre=>{const f=famW(.7);return res(pre+f,fate('captured',place,{local,massacre}));};
  const wrap=(pre,how)=>()=>{const f=famW(how==='captured'?.7:.3);return res(pre+f,fate(how,place,{local,massacre}));};
  const fight=()=>{
    const p=.25+(P.sk.arch+P.sk.ride)/400+P.hp/300;
    if(chance(p)){fx({hp:-ri(10,25),fame:6,arch:3});return cap('성벽에서 끝까지 싸웠다. 화살과 돌이 쏟아지는 가운데 중상을 입고 쓰러졌다.');}
    P.lastCause=`${place}에서 싸우다 전사했다`;fx({hp:-100,fame:5});
    return `${place}에서 마지막까지 싸웠다. 몽골의 화살비 속에 쓰러졌다.`;
  };
  const flee=()=>{
    if(roll(.38,P.sk.wit,P.sk.ride,P.hp/2)){P.flags.refugee=1;P.flags.survivor=1;loseWealth(.7);fx({hp:-8,wit:3,fame:-3});
      return '혼란을 틈타 빠져나왔다. 가진 것 대부분을 버리고 산과 사막을 헤맨 끝에 겨우 살아남았다. 이제 난민이다.'+kinMoveSettle(.5);}
    fx({hp:-10});return cap('도망치다가 몽골 기병에게 붙잡혔다.');
  };
  const hide=()=>{
    if(chance(.4+(cityResist?0:.15))){P.flags.survivor=1;loseWealth(.5);P.subject=true;fx({hp:-5});
      return nomad?'며칠 동안 덤불과 바위틈에서 숨을 죽였다. 군대가 지나간 뒤 나와 보니 천막촌은 잿더미였다. 가진 것 절반을 잃었지만 살아남았다.'
        :'며칠을 어둠 속에서 숨죽였다. 군대가 지나간 뒤 기어 나오니 도시는 잿더미였다. 가진 것 절반을 잃었지만 살아남았다.';}
    return cap('숨은 곳이 발각되었다.');
  };
  const hideT=nomad?'덤불과 골짜기에 숨는다':'지하실에 숨는다';
  const opts=[];
  if(head){
    opts.push({t:'사자를 맞아 항복한다',sub:'가문과 백성의 목숨을 먼저 지킨다',fn:wrap('사자를 맞아 무릎을 꿇었다.','surrender')});
    opts.push({t:'몽골에 먼저 협력하겠다고 나선다',sub:'지위를 지키지만 동포의 눈총을 받는다',fn:()=>{
      if(chance(.8)){fx({fame:-8,wealth:-10,wit:3});P.subject=true;P.flags.collab=1;P.flags.survivor=1;if(P.job!=='lord')setJob('lord',1);
        return '몽골 장수를 찾아가 길을 안내하고 식량을 바치겠다고 했다. 몽골은 당신을 현지 통치자로 세웠다. 살아남았지만 동포들은 당신을 배신자라 부른다.';}
      return cap('몽골은 당신의 제안을 믿지 않았다.');}});
    opts.push({t:'끝까지 항전한다',sub:'이길 가능성은 희박하다',fn:()=>{
      if(chance(.1+(P.sk.wit+P.sk.arch)/600)){fx({fame:25,wealth:-10,hp:-12});P.flags.survivor=1;return '믿기지 않게도 몽골군이 한 차례 물러났다. 당신은 몽골에 맞서 지켜 낸 사람으로 이름이 났다. 그러나 그들이 다시 돌아오지 않으리란 보장은 없다.';}
      return fight();}});
    opts.push({t:'가족과 재산을 챙겨 도주한다',sub:'지위와 재산을 버려야 한다',fn:flee});
  }else if(P.female){
    opts.push({t:'가문과 이웃의 결정을 따른다',sub:cityResist?'싸움에 진다면 포로가 된다':'몽골의 처분을 기다린다',
      fn:wrap(cityResist?'남자들이 싸우는 동안 아이들을 끌어안고 숨죽였다. 곧 몽골 기병이 들이닥쳤다.':'남자들이 무기를 내려놓고 무릎을 꿇었다. 당신도 사람들 사이에 섞여 앉았다.',cityResist?'captured':'surrender')});
    opts.push({t:'아이들과 함께 도망친다',sub:'붙잡히면 더 가혹한 대가',fn:flee});
    opts.push({t:hideT,sub:'운이 좋으면 눈에 띄지 않는다',fn:hide});
  }else{
    opts.push({t:cityResist?(local?'부족장의 명령에 따라 말에 오른다':'성주의 명령에 따라 성벽에 오른다'):(local?'부족장을 따라 투항한다':'성주를 따라 투항한다'),sub:cityResist?'패하면 포로가 된다':'몽골의 처분을 기다린다',
      fn:cityResist?fight:wrap('무기를 버리고 무릎을 꿇었다.','surrender')});
    opts.push({t:'몰래 도망친다',sub:'붙잡히면 더 가혹한 대가',fn:flee});
    opts.push({t:hideT,sub:'운이 좋으면 눈에 띄지 않는다',fn:hide});
  }
  if(o.extra&&!P.female)o.extra(opts);
  return withConsult(sc(o.title,o.intro+(head?'':'\n'+stat)+tail,opts,'전쟁'));
}

  if(P.status==='slave')return [];
  if(!f&&(s.ride+s.arch)/2>=24)L.push('soldier');

function tick(dt){

  const S=G.scene;

  if(S.kind==='event'){
    if(r.auto){r.dec+=dt*r.speed;if(r.dec>=2400){r.dec=0;autoDecide();return true;}}
    return false;
  }
  if(S.kind!=='focus')return false;
  if(!r.plan){beginYear();return true;}
  r.acc+=dt*r.speed;
  const f=Math.min(1,r.acc/r.yearMs),pl=r.plan;let ch=false;
  while(pl.i<pl.items.length&&(pl.items[pl.i].t<=f||r.acc>=r.yearMs)){
    const it=pl.items[pl.i++];ch=true;
    if(it.type==='line')emitLine(it);
    else if(it.type==='card')feedPush(it.card);
    else if(it.type==='ev'){inlineEvent(it.scene);}
    else if(it.type==='scene'){G.scene=it.scene;r.dec=0;break;}
    else if(it.type==='birth'){
      const bs=v16birthTick(it);
      if(P.dead){G.scene={kind:'end',title:'삶의 끝'};afterScene();break;}
      if(bs){G.scene=bs;r.dec=0;break;}
      ch=true;
    }
    else if(it.type==='end'){P.dead=true;G.scene={kind:'end',title:'삶의 끝'};afterScene();break;}
  }
  if(G.scene.kind==='focus'&&r.acc>=r.yearMs&&pl.i>=pl.items.length){r.plan=null;r.acc=0;ch=true;}
  return ch;
}

/* 첩 관계에서의 임신: 여성 노예 플레이어에게 활성 첩 관계가 있고 살아 있는 배우자가 없을 때만 친부(현재 주인)를 임신 시점 기록으로 만든다 */
function concFather(){

/* ===== v7: 마누스 A분류 이식 (1단계) =====
   마누스(Godot) ev_*.gd 의 A분류 이벤트 25개와 일상 지문 묶음 24개를 현재 게임 규칙으로 옮겼다.
   - 능력치: bow→arch(궁술), social→wit(처세), ride/know/craft 그대로, health→hp
   - 신분: tier→rank(0노예~5), status slave/captive/free 그대로
   - 문화권: steppe/muslim/east/west ← pol(steppe·mongol / khw·per / jin·xia / rus)
   - 종교: tengri→teng, nestorian→nest, islam→muslim, orthodox→orth·cath, folk_east→budd
   - 마누스의 S.hist(역사 문장)는 '역사 노트' 피드 항목으로 낸다(2단계에서 연표와 통합 예정).
   - 지문·선택지·결과 문장은 줄이지 않고 그대로 옮겼다(조사만 자동 보정). */

/* ---------- 변환 도우미 ---------- */
const V7CG=P=>isMg(P)?'steppe':(P.pol==='khw'||P.pol==='per')?'muslim':(P.pol==='jin'||P.pol==='xia'||P.pol==='goryeo')?'east':'west';
const V7REL=P=>({teng:'tengri',nest:'nestorian',muslim:'islam',orth:'orthodox',cath:'orthodox',budd:'folk_east'})[P.religion]||'tengri';
const v7nf=P=>P.status==='free';
const v7slave=P=>P.status==='slave'||P.status==='captive';
/* 곁에 없는 자녀(매각·고향에 남음): 함께 지내는 장면(양육·병치레·사춘기·혼사 준비)의 대상에서 뺀다. 소식(kinNews)은 별도 경로로 전해진다 */
const kidAway=k=>!!k&&(k.apart==='sold'||k.apart==='left');
const v7kids=P=>(P.kids||[]).filter(k=>k.alive&&k.apart!=='sold'&&k.apart!=='left'); /* 매매로 헤어져 지내는 자녀는 곁에 없다 */
const v7sp=P=>(P.spouse&&P.spouse.alive)?P.spouse.name:'배우자';
function v7bt(w){
  w=w.replace(/[\s)\]'"(”’]+$/,'');if(!w)return -1;
  const ch=w[w.length-1],c=ch.charCodeAt(0);
  if(c>=0xAC00&&c<=0xD7A3)return (c-0xAC00)%28;
  if(/[0-9A-Za-z]/.test(ch))return 0;
  return -1;
}
/* {토큰} 치환 + 이(가)/을(를)/은(는)/과(와)/(으)로 보정 */
function jf(s,x){
  if(typeof s!=='string')return s;
  s=s.replace(/\{(\w+)\}/g,(m,k)=>{
    if(x&&x[k]!==undefined)return x[k];
    if(k==='me')return P.name;
    if(k==='sp')return v7sp(P);
    return m;
  });
  return s.replace(/\s?(\(이\)가|\(이\)라고)/g,(m,p,off,str)=>{const b=v7bt(str.slice(0,off));return p==='(이)가'?(b>0?'이':'가'):(b>0?'이라고':'라고');}).replace(/(이\(가\)|가\(이\)|을\(를\)|를\(을\)|은\(는\)|는\(은\)|과\(와\)|와\(과\)|\(으\)로)/g,(m,p,off,str)=>{
    const b=v7bt(str.slice(0,off));
    if(m==='(으)로')return (b===0||b===8||b<0)?'로':'으로';
    const t={'이(가)':['이','가'],'가(이)':['이','가'],'을(를)':['을','를'],'를(을)':['을','를'],'은(는)':['은','는'],'는(은)':['은','는'],'과(와)':['과','와'],'와(과)':['과','와']}[m];
    return b>0?t[0]:t[1];
  });
}
/* 능력 성장: 기질 보정 적용(마누스 S.grow 와 같은 방식). 노예는 fx 가 깎는다 */
function v7gr(k,a){

/* 마누스 EvBase.odds / roll */
function v7odds(stats,base,scale,bonus){
  let s=0;stats.forEach(k=>s+=v7sk(k));
  return Math.max(.05,Math.min(.95,base+s/(scale||100)+(bonus||0)));
}

/* 역사 노트: 결과/지문 문장과 짝지어 두면 그 문장이 피드에 나온 직후 notesFor 가 노트를 낸다 */
const V7LN=[];

function v7RN(text,noteId,x){const t=jf(text,x);if(noteId){V7LN.push([t,noteId]);if(V7LN.length>60)V7LN.shift();}return t;}

/* 선택 장면 만들기: 제목·본문·선택지·결과에 조사 보정을 입힌다 */
function v7sc(title,text,opts,tag){
  return sc(jf(title),jf(text),opts.map(o=>{
    const fn=o.fn;
    const n={t:jf(o.t),fn:()=>{const r=fn();return (typeof r==='string')?jf(r):(r&&r.text?Object.assign({},r,{text:jf(r.text)}):r);}};

}

v7note('v7_guest','초원의 환대','초원의 환대는 안전과 정보의 통로이기도 했다. 나그네는 소식을 전했고, 주인은 훗날 같은 대접을 받을 수 있었다.');
v7note('v7_envoy_wife','오르도의 안주인','몽골 귀족 여성은 천막(오르도)의 안주인으로서 손님을 맞고 선물을 관리했다. 부인의 조언은 남편의 외교에 영향을 주었고, 때로는 직접 사절을 만나기도 했다.');
v7note('v7_chief_dispute','관습법과 대자사','초원의 지도자들은 관습법에 따라 분쟁을 중재했다. 칭기즈 칸 이후에는 \'대자사(야사)\'로 법이 성문화되어 절도, 거짓말, 간통 등에 엄격한 규정이 적용되었다.');
v7note('v7_taboo','초원의 금기','몽골 사회에는 문턱을 밟지 않기, 칼로 불을 건드리지 않기, 물과 불을 더럽히지 않기 같은 금기가 있었다. 이를 어기면 하늘의 벌을 받는다고 믿었고, 칭기즈 칸 이후에는 법으로도 금지되었다.');
v7note('v7_end_teng','초원의 장례','몽골 유목민은 죽은 이의 무덤을 표시하지 않는 풍습이 있었고, 칭기즈 칸의 무덤도 지금까지 정확한 위치가 알려지지 않았다. 사람들은 말에 태워 묻기도 했다.');

const MOM_LINE=/(^|[^안시친양])(?<!집안의 )어머니(?!\s*대지)/; /* '집안의 어머니'(안주인이라는 일반 표현)·'어머니 대지'·시어머니·친어머니는 곁에 있는 어머니를 가리키지 않는다 */
const momLine=t=>MOM_LINE.test(t)&&!/기억/.test(t); /* '기억에 남았다'처럼 지난 일을 떠올리는 문장은 곁에 없어도 어울린다 */
function v7poolLine(){
  const here=momHere();
  const okI=(p,i)=>here||!momLine(p[3][i]);
  const el=V7POOLS.filter(p=>p[1](P)&&p[3].some((t,i)=>okI(p,i)));
  if(!el.length)return;
  const p=wpick(el.map(x=>[x,x[2]]));
  P.seen=P.seen||{};
  let idx=p[3].map((t,i)=>i).filter(i=>okI(p,i)&&!P.seen[p[0]+i]);
  if(!idx.length){p[3].forEach((t,i)=>delete P.seen[p[0]+i]);idx=p[3].map((t,i)=>i).filter(i=>okI(p,i));}
  const i=v7pick(idx);P.seen[p[0]+i]=1;
  v7L(p[3][i]);
}

 ['m_succ_dispute','형제간 계승 다툼','형제간의 계승 다툼은 초원 지도자 가문에서 흔한 일이었다. 칭기즈 칸이 이복형 벡테르를 제거한 일, 훗날 칸의 아들들이 후계를 두고 갈등한 일이 대표적이다.',/형제와의 영지 다툼|형제와의 다툼/,null,null],
 ['m_kuriltai','쿠릴타이','쿠릴타이는 부족의 지도자와 귀족이 모여 칸을 선출하고 큰 전쟁, 법, 분배를 논하던 회의였다. 몽골 제국 시기에는 칸의 계승과 원정 결정의 핵심 기구가 되었다.',/1229년 쿠릴타이|초원이 하나가 되다/,null,null],
 ['m_rumor','소문과 모략','귀족 사회에서 소문과 모략은 권력 투쟁의 일부였다. 칭기즈 칸 가문에서도 형제와 사촌 사이에 의심과 비방이 오가며 갈등이 커지곤 했다.',/정적의 모함/,null,null],
 ['m_anda','안다(의형제)','안다(의형제)는 몽골 사회에서 혈연에 버금가는 신뢰를 뜻했다. 테무진과 자무카가 안다를 맺었다가 훗날 적이 된 이야기가 널리 알려져 있다.',/안다\(의형제\)|안다의 손길|안다의 부탁/,null,null],
 ['m_keshig','케식','칭기즈 칸은 1206년 케식을 1만 명으로 확대 개편했다. 천호장·백호장의 아들들이 주로 선발되었고, 이들은 칸의 경호와 행정을 맡는 한편 가문의 충성을 담보했다.',/케식 선발/,null,null],
 ['m_nestorian','초원의 경교','케레이트와 나이만 등 몽골 고원의 일부 부족은 11세기 이후 경교(네스토리우스파 기독교)를 받아들였다. 칭기즈 칸의 며느리 소르칵타니 베키도 케레이트 출신 경교도였으며, 몽골 제국은 대체로 종교에 관대했다.',/경교의 권유/,null,null],
 ['m_tolerance','종교적 관용','칭기즈 칸 시대의 몽골은 모든 종교에 관대했고, 성직자에게 세금과 부역을 면제해 주었다. 서역 상인들을 통해 이슬람이 초원에 서서히 퍼졌으며, 훗날 서쪽 칸국들은 이슬람을 받아들이게 된다.',/이슬람 상인의 권유|교회와 몽골/,null,null],
 ['m_decimal_levy','십진법 소집','1206년 이후 몽골은 모든 성인 남자를 십진법 조직의 일원으로 편입시켰다. 평소엔 목축을 하다가 소집되면 병사로 출정했으며, 소집에 응하지 않으면 군율에 따라 처벌받았다.',/몽골군의 징발|칸의 소집/,null,null],
 ['m_refugee','전쟁과 피난','전쟁이 닥치면 많은 이들이 고향을 떠나 피난길에 올랐다. 호라즘 원정 때 일부는 아나톨리아와 시리아로, 금나라 사람들은 남송 방면으로, 루스와 쿠만 사람들은 헝가리와 폴란드 쪽으로 도피했다.',/피난민의 행렬|난민의 정착/,null,null],
 ['m_hashar','하샤르','몽골군은 정복한 도시에서 징발한 이들을 \'하샤르\'라 불러 공성전에서 선봉이나 인부로 쓰는 일이 있었다. 반면 항복한 지도자나 기술자는 우대하기도 했다.',/공성전/,null,null],
 ['m_skill_pick','기술자의 선별','몽골은 정복지의 장인, 서기, 의사, 통역을 따로 가려내어 제국 각지로 보냈다. 이들은 포로 신분이지만 보호받았고 일부는 훗날 높은 지위에 올랐다.',/포로의 쓰임새/,null,null],
 ['m_orphan','전쟁고아의 양육','몽골 귀부인들은 전쟁 고아를 거두어 양자로 키우는 일이 있었다. 칭기즈 칸의 어머니 후엘룬은 메르키트·타이치우트 등 여러 부족의 고아를 양자로 길렀고, 이 아이들은 훗날 칸의 중요한 장수나 관리가 되었다. (시기 구타구 등)',/어린 ?이 포로/,null,'child'],
 ['m_child_slave','어린이와 노예','이 시대 전쟁에서 어린이는 포로나 노예가 되는 일이 많았다. 몽골 사회의 노예(보골)는 가내 노동과 목축을 담당했고 일부는 주인 가문의 일원처럼 길러졌다.',/노예가 되|노예의 대열/,P=>P.age<14,'slave'],
 ['m_women_loot','정복지의 여성','정복지의 여성은 전리품으로 분배되어 병사나 장수의 아내·첩이 되는 일이 있었다. 칭기즈 칸 자신도 타타르 귀족의 딸 예수이와 예수겐 자매를 아내로 맞았다. 이는 이 시대의 약탈혼이자 정치 관행이었다.',null,null,null],
 ['m_captive_sold','포로의 분배','전쟁 포로는 분배되거나 노예 시장에 팔렸다. 이 시대에는 귀족도 패배하면 한순간에 노예로 전락하는 일이 흔했다.',/노예로|노예의 대열/,null,'slave'],
 ['m_early_submit','일찍 항복한 지도자','몽골은 일찍 항복한 지도자를 우대하는 경우가 많았다. 위구르의 이디쿠트나 카를룩의 아르슬란 칸은 자발적으로 복속해 칭기즈 칸의 사위가 되기도 했다. 반대로 끝까지 버틴 이들은 가혹한 대가를 치렀다.',/항복 사절|쿠두카 베키의 귀순/,null,null],
 ['m_bride_raid','신부 약탈','초원에서는 신부를 약탈하는 풍습이 있었다. 칭기즈 칸의 어머니 후엘룬은 메르키트의 치레두에게 시집가던 길에 예수게이에게 약탈되어 그의 아내가 되었고, 그의 아내 보르테도 메르키트에게 약탈되었다가 구출되었다. 이런 약탈혼은 부족 간 복수의 연쇄를 낳곤 했다.',/약탈혼|아내가 되라|끌려가 아내|천막으로 끌려/,null,'raid'],
 ['m_freed','해방된 노예','몽골 사회에서도 노예가 주인에게 공을 세우거나 기술을 인정받아 해방되는 경우가 있었다. 일부 해방 노예나 포로 출신은 칸의 신임을 얻어 고위직에 오르기도 했다.',/노예의 길/,null,null],
 ['m_deport2','정복지의 기술자 이주','몽골은 정복지의 장인, 서기, 통역관, 의사를 따로 가려내어 칸의 도읍이나 제국 곳곳으로 이주시켰다. 사마르칸트의 장인 3만 명이 이주되었다는 기록도 있다(과장 가능성 있음).',/수레에 실려|몽골 본토로 끌려/,null,'deport'],
 ['m_raid_era','12세기 후반의 초원','12세기 후반의 초원은 부족 간 습격과 보복으로 얼룩져 있었다. 약탈의 대상은 가축과 사람이었고, 포로가 된 여성과 아이는 상대 부족에 흡수되는 일이 흔했다.',/이웃 부족의 습격/,P=>P.year<1206,null],
 ['m_tatar_1196','1196년의 타타르 정벌','1196년 금나라는 타타르를 치기 위해 테무진·토오릴(케레이트)과 연합했다. 이 전투에서 테무진은 금나라로부터 \'자우트 쿠리\' 칭호를 받아 세력을 키웠다.',/울자 강의 전투/,null,null],
 ['m_tatar_1202','1202년 타타르의 멸망','1202년 테무진은 타타르를 정벌하고 부족을 해체했다. 몽골의 선대 지도자 예수게이를 독살했다는 오랜 원한이 명분이 되었고, 많은 타타르 남자가 죽고 여성과 아이는 몽골 가문에 분배되었다고 전해진다.',/타타르의 멸망/,null,null],
 ['m_kereit_1203','1203년 케레이트','1203년 테무진은 발주나 맹약 이후 케레이트를 기습해 굴복시켰다. 케레이트의 많은 이들은 몽골 씨족과 장수들에게 분배되었고, 일부 귀족 여성은 칭기즈 칸 일족과 혼인했다.',/케레이트의 몰락/,null,null],
 ['m_naiman_1204','1204년 나이만','1204년 칭기즈 칸은 나이만의 타양 칸을 격파했다. 나이만의 서기 타타통가가 포로가 되어 칸 곁에서 위구르 문자를 도입하는 데 기여한 일은 유명하다.',/차키르마우트 전투/,null,null],
 ['m_merkit','메르키트의 원한','메르키트는 테무진의 아내 보르테를 약탈한 일로 오랜 원한을 샀다. 1190년대 이후 여러 차례 공격을 받았고, 잔당은 1200년대 후반까지 쫓겨 다녔다.',/메르키트의 패배/,null,null],
 ['m_oirat_1207','1207년 오이라트','1207~1208년 주치의 원정에서 오이라트의 쿠두카 베키는 싸우지 않고 항복했다. 그는 혼인 동맹으로 칭기즈 칸 일족의 사돈이 되어 우대받았다.',/쿠두카 베키의 귀순/,null,null],
 ['m_jin_1211','1211년 금 원정','1211년 칭기즈 칸은 금나라를 침공해 야호령 전투에서 대승을 거두었고, 1215년에는 중도(지금의 베이징)를 함락했다. 전란과 기근으로 화북의 인구가 크게 줄었다.',/몽골군이 쳐들어오다|중도 함락/,null,null],
 ['m_jin_1232','1232년 개봉 포위전','1232~1233년 개봉 포위전에서는 굶주림과 역병으로 성안에서 수십만 명이 희생되었다는 기록이 있다. 1234년 금나라는 몽골과 남송의 협공으로 멸망했다.',/변경 공방전/,null,null],
 ['m_khw_1219','호라즘 원정','1219년 호라즘 총독이 몽골 사절·상인단을 살해한 일이 원정의 계기가 되었다. 1220~1221년 부하라, 사마르칸트, 메르브, 니샤푸르, 헤라트 등이 차례로 함락되었다. 항복한 도시는 비교적 가벼운 처벌을 받기도 했으나 끝까지 버틴 도시는 처참했다.',/(부하라|사마르칸트|우르겐치) 포위|(메르브|니샤푸르|발흐)의 최후/,null,null],
 ['m_hulegu','훌라구의 원정','1256년 훌라구는 알라무트의 이스마일파 요새를 굴복시키고 1258년 바그다드를 함락해 아바스 왕조를 끝냈다. 많은 학자와 장서가 피해를 입었으나, 정복 이후 일 칸국은 학문과 천문학을 후원하기도 했다.',/알라무트 포위|바그다드 포위/,null,null],
 ['m_persia_1231','1230년대 이란 서부','1230년대 초르마칸의 원정으로 이란 서부와 아제르바이잔·조지아 일대가 몽골의 영향권에 들어갔다. 다수의 도시는 공납을 약속하고 항복해 큰 파괴를 면했다.',null,null,null],
 ['m_rus_1237','바투의 루스 원정','1237~1240년 바투의 몽골군은 랴잔, 블라디미르, 키예프 등 루스의 주요 도시를 함락시켰다. 이후 루스 공국들은 킵차크 칸국(황금 군단)에 공물을 바치는 종속 관계에 들어갔다.',/랴잔 함락|블라디미르 함락|키예프 함락|볼히니아의 불길/,null,null],
 ['m_georgia_1236','조지아와 몽골','1236년 몽골 장군 초르마칸의 침공 이후 조지아 귀족들은 항전하거나 산악 요새로 피신하거나 항복했다. 1243년 조지아 왕국은 몽골의 종주권을 인정했다.',/조지아군의 패배|트빌리시의 항복/,p=>p.year>=1236,null],
 ['m_kipchak_1236','킵차크 초원의 정복','1236~1241년 몽골은 킵차크(쿠만) 초원을 정복했다. 쿠만의 코텐 칸은 헝가리로 달아났고, 많은 쿠만인이 몽골 군대에 편입되거나 노예 시장으로 팔렸다.',null,null,null],
 ['m_kipchak_1220','수부타이와 제베의 추격','1220~1223년 수부타이와 제베가 이끄는 몽골 원정군은 카스피 해를 돌아 킵차크 초원을 지나 루스의 연합군을 칼카 강에서 격파했다(1223).',/칼카 강의 전투/,null,null],
 ['m_death_khw1','호라즘 원정의 피해','1219~1221년 몽골의 호라즘 원정 때 부하라·사마르칸트·메르브·니샤푸르 같은 도시들이 큰 피해를 입었다. 사망자 수는 연대기에서 크게 과장되었을 가능성이 높지만, 도시와 관개 체계가 심하게 파괴된 것은 분명하다.',null,null,null],
 ['m_death_khw2','훌라구 원정의 피해','1256~1258년 훌라구의 원정으로 알라무트와 바그다드가 무너졌다. 도시 주민들은 큰 희생을 치렀고 학자와 장서도 막대한 피해를 입었다.',null,null,null],
 ['m_death_jin','화북의 전쟁','1211년부터 1234년까지 몽골과 금나라의 전쟁은 화북 지방의 인구와 농경지를 크게 황폐화시켰다. 성이 함락되고 피난민이 길을 메웠으며 기근과 역병이 겹쳤다.',null,null,null],
 ['m_death_rus','루스 원정의 피해','1237~1241년 바투의 원정으로 랴잔, 블라디미르, 키예프 등 루스의 주요 도시가 차례로 무너졌다. 인구 감소와 도시 파괴는 컸으나 정확한 규모는 학자들 사이에서도 논쟁이 있다.',null,null,null],
 ['m_death_georgia','조지아의 복속','1236년 이후 몽골 장군 초르마칸의 침공으로 조지아 왕국은 결국 몽골의 속국이 되었다. 많은 지방이 황폐해졌고 일부 귀족은 산악 요새로 피신했다.',null,null,null],
 ['m_death_kipchak','킵차크 초원의 정복','1236~1241년 몽골의 서방 원정 때 킵차크(쿠만) 초원은 정복되었다. 일부 쿠만인은 헝가리로 피신했고 많은 이가 몽골 군에 편입되거나 노예로 팔렸다.',null,null,null],

function v9var(topic,id,cond,mk,o){

      return orig(P);
    };
  }

  opts:[{t:'아는 것을 있는 대로 증언한다',sub:'신임을 얻지만 원한을 살 수 있다',fn:()=>{const bad=P.lineage.house==='오고타이'||P.lineage.house==='차가타이';fx({fame:bad?-8:6,wealth:bad?-4:6});return bad?'같은 혈통의 사람들 앞에서 증언한 대가로 가문 어른들에게 외면받았다.':'몽케의 신임을 얻었다. 증언대에 선 사람들의 얼굴이 오래 기억에 남았다.';}},
    {t:'기억이 나지 않는다며 입을 다문다',fn:()=>{fx({wit:3,fame:-2});return '증인 자리에서 말을 아꼈다. 의심 어린 시선이 따랐지만 화를 피했다.';}},
    {t:'억울한 사람들을 위해 선처를 청한다',sub:'발각되면 위험하다',fn:()=>{if(chance(.4)){fx({fame:5,wit:2});return '몇 사람의 목숨이 보전되었다. 당신의 용기는 조용히 알려졌다.';}fx({fame:-12,wealth:-14});P.flags.exiled=1;return '청원은 받아들여지지 않았고 당신은 영지의 일부를 잃은 채 변방으로 밀려났다.';}}
  ]}));
H('pol1262',1262,P=>!!P.lineage&&P.age>=16,P=>politics('1262',{title:'두 칸의 전쟁',aligned:h=>h==='주치'||h==='툴루이',
  text:`쿠빌라이와 아리크부케가 다투는 사이 서쪽에서는 훌라구와 베르케가 코카서스를 두고 맞섰다. 같은 칭기즈칸의 손자들이 서로를 향해 군대를 보낸다. ${P.lineage.house}의 ${relWord(P)}인 당신에게 두 칸의 사신이 차례로 찾아왔다.`,

    {t:'칭기즈칸의 가문끼리 싸울 수 없다며 중재를 청한다',sub:'받아들여질 가능성은 낮다',fn:()=>{if(chance(.3)){fx({fame:6,wit:3});return '두 진영의 사신들이 당신의 말에 잠시 귀를 기울였다. 그러나 전쟁은 멈추지 않았다.';}fx({fame:-3,wit:2});return '양쪽 모두 당신의 중재를 한낱 약한 소리로 받아들였다.';}}
  ]}));
H('pol1269',1269,P=>!!P.lineage&&P.age>=16,P=>politics('1269',{title:'탈라스의 약속',aligned:h=>h==='오고타이'||h==='차가타이',
  text:`중앙아시아의 탈라스 강 가에서 카이두와 서방의 칸들이 모였다. 쿠빌라이가 중국에 머무르며 초원의 전통을 잃어 간다는 불만이 터져 나온다. ${P.lineage.house}의 ${relWord(P)}인 당신은 그 천막에 초대받았다.`,

    {t:'참석하지 않고 가문의 영지만 지킨다',fn:()=>{fx({wit:2,wealth:-1});return '큰 흐름에 휩쓸리지 않고 영지의 가축을 지켰다.';}}
  ]}));
H('pol1287',1287,P=>!!P.lineage&&P.age>=16,P=>politics('1287',{title:'나얀의 반란',aligned:h=>true,
  text:`만주 일대의 왕족 나얀이 쿠빌라이에게 반기를 들었다. 칭기즈칸의 동생 가문의 후손인 그는 카이두와 손을 잡았다는 소문이 돈다. 나이 많은 쿠빌라이가 직접 군대를 이끌고 나선다. ${P.lineage.house}의 ${relWord(P)}인 당신은 어느 쪽에 설 것인가.`,

    {t:'나얀의 편에 서겠다고 은밀히 약속한다',sub:'발각되면 처형',fn:()=>{P.flags.side1287='nayan';if(chance(.45)){P.lastCause='나얀의 반란에 가담했다는 죄로 처형당했다';fx({hp:-100});return '반란은 빠르게 진압되었다. 가담자의 명단이 드러났고 당신의 이름도 있었다.';}fx({fame:-15,wealth:-20});return '반란이 진압된 뒤 당신의 이름은 간신히 명단에서 빠졌다. 그러나 재산을 크게 잃었다.';}},
    {t:'관망하며 때를 기다린다',fn:()=>{fx({wit:3});return '반란의 결말을 지켜본 뒤 움직이기로 했다.';}}
  ]}));

H('daidu1267',1267,P=>h10M(P)&&P.age>=14&&free(P),P=>sc('대도의 성벽','연경의 북동쪽 벌판에 새 도성이 올라가기 시작했다. 쿠빌라이가 중국식 도성을 지으라 명했고, 전국에서 장인과 일꾼이 불려 왔다. 성벽 아래에는 막사와 장터가 줄지어 선다.',[
  {t:'공사장 근처에서 장사를 한다',fn:()=>{fx({wealth:6,wit:3});return '일꾼들에게 음식과 술을 팔아 짭짤한 이익을 남겼다.';}},
  {t:'일꾼으로 나선다',sub:'고되지만 품삯이 확실하다',fn:()=>{fx({wealth:4,hp:-4,craft:2});return '벽돌을 나르고 흙을 다지며 한 해를 보냈다. 몸은 상했지만 기술을 조금 익혔다.';}},
  {t:'도성이 올라가는 모습을 구경한다',fn:()=>{fx({know:3});return '정해진 바둑판 모양의 도로와 성벽을 보며 이 땅의 새 주인이 누구인지 실감했다.';}}

H('xiangyang1273',1273,P=>(P.pol==='mongol'||P.pol==='jin')&&(P.job==='artisan'||P.sk.craft>=35)&&P.age>=16&&free(P),P=>sc('양양의 투석기','5년째 이어진 양양 포위전에 서방에서 온 이슬람 공병들이 거대한 평형추 투석기를 들여왔다. 군영은 이 기계를 만들 일손과 재료를 구하고 있다. 당신의 솜씨가 소문으로 군영에 닿았다.',[

  {t:'재료만 대 주고 대가를 받는다',fn:()=>{fx({wealth:5,craft:1});return '목재와 쇠를 군영에 대고 값을 받았다. 전장에는 나가지 않았다.';}},
  {t:'징발을 피해 몸을 숨긴다',sub:'발각되면 처벌',fn:()=>{if(chance(.6)){fx({wit:2});return '아는 사람의 집에 몸을 숨겨 징발을 피했다.';}fx({fame:-4,wealth:-6});return '징발관에게 들켜 벌금을 물었다.';}}
],'1273년'));
H('japan1281',1281,P=>h10M(P)&&!P.female&&P.age>=16&&P.age<=50&&free(P),P=>sc('동쪽 바다의 함대','일본을 다시 치기 위한 거대한 함대가 항구에 모였다. 고려와 중국 남쪽에서 온 배가 수백 척이다. 몽골 관리가 사람을 모아 배에 태운다. 당신에게도 승선하라는 명이 내려왔다.',[
  {t:'배에 오른다',sub:'공을 세울 기회이나 바다가 두렵다',fn:()=>{if(chance(.35)){P.lastCause='일본 원정길의 바다에서 태풍을 만나 목숨을 잃었다';fx({hp:-100});return '해안에 닿은 직후 태풍이 함대를 덮쳤다. 당신은 끝내 땅을 밟지 못했다.';}fx({hp:-10,fame:4,wealth:2});return '태풍에서 간신히 살아남아 돌아왔다. 많은 동료가 바다에 빠져 죽었다.';}},
  {t:'뇌물을 써서 징발을 피한다',sub:'재물을 잃는다',fn:()=>{fx({wealth:-8,wit:2});return '관리에게 재물을 바쳐 승선 명단에서 이름을 지웠다. 함대의 소식이 들려오자 가슴을 쓸어내렸다.';}},
  {t:'보급 물자를 수레에 실어 나른다',fn:()=>{fx({wealth:3,hp:-3,craft:1});return '배에 오르지는 않고 항구에서 물자를 날랐다. 바다 건너 소식은 불안한 소문으로 돌아왔다.';}}
],'1281년'));
H('ahmad1282',1282,P=>P.religion==='muslim'&&(P.pol==='mongol'||P.pol==='jin')&&P.age>=18&&free(P),P=>sc('재상의 죽음','재무를 맡아 세도를 부리던 무슬림 대신 아흐마드가 반대파에게 살해되었다. 도성에는 쿠빌라이가 크게 노했다는 소문이 돈다. 같은 신앙을 가진 사람들은 숨을 죽이고, 아흐마드의 일족에게는 의심의 눈길이 쏠린다.',[

  {t:'억울한 이들을 위해 증언해 준다',sub:'위험하지만 이름이 남는다',fn:()=>{if(chance(.5)){fx({fame:6,wit:2});return '증언이 받아들여져 몇 사람이 풀려났다.';}fx({fame:-6,wealth:-8});return '증언이 오히려 의심을 샀다. 한동안 관가의 감시를 받았다.';}}
],'1282년'));
H('sauma1287',1287,P=>isChristian(P)&&P.age>=16&&(P.pol==='mongol'||P.pol==='per'||P.pol==='jin')&&free(P),P=>sc('먼 서쪽으로 떠나는 사제','대도에서 온 경교 사제 랍반 사우마가 사절단과 함께 서쪽으로 간다고 한다. 예루살렘 순례를 꿈꾸던 그는 이제 로마와 서유럽의 왕들을 찾아간다. 교회 사람들이 길가에 모여 그를 배웅한다.',[
  {t:'사제를 찾아 안부를 부탁한다',fn:()=>{fx({know:3,fame:1});return '먼 서쪽의 형제들에게 전해 달라며 편지를 맡겼다. 답이 올지는 알 수 없다.';}},

H('ghazan1295',1295,P=>(P.pol==='per'||P.pol==='khw')&&P.age>=16&&free(P),P=>sc('가잔의 칙령','일 칸국의 새 칸 가잔이 이슬람을 받아들이고 귀족들에게도 따르라 권한다. 사원과 학교가 새로 지어지고, 다른 종교를 가진 사람들의 처지는 불안해졌다. 당신이 사는 도시에도 칙령이 도착했다.',[

H('exam1313',1313,P=>V7CG(P)==='east'&&P.age>=16&&P.age<=45&&free(P)&&!P.female&&P.sk.know>=30,P=>sc('과거가 다시 열린다','오래 중단되었던 과거 시험을 다시 치른다는 조서가 내려왔다. 학문을 닦은 사람들은 술렁인다. 다만 몽골인과 색목인, 한인과 남인은 나뉘어 선발되고, 한인과 남인에게는 문이 좁다.',[

  {t:'차별이 심한 제도라며 외면한다',fn:()=>{fx({wit:2});return '제도의 불공평함을 한탄하며 하던 일에 매진했다.';}}

/* --- temper : 6세 기질 선택(temperScene)은 그대로 둔다. 마누스의 '기질이 드러나는 날'(4~5세 상황 선택)은

/* --- 부모를 잃은 아이의 양육자 (b_orphaned 와 연결) ---
   P.adopt={by:{name,female,age,rel:'kin'|'elder'},year,why:'orphan'} : 양육자 기록. 친부모(P.father/P.mother)는 건드리지 않는다.
   형제자매와 함께 지내는 선택은 양육자가 정해진 것이 아니므로 P.adopt 를 만들지 않는다. 신분·상속·혼인·출산에는 쓰이지 않는다. */
function orphanCareScene(){
  const sibs=(P.sibs||[]).filter(x=>x.alive&&!x.lost&&!x.hidden); /* 아직 태어난 사실을 모르는 숨은 동생은 제외 */
  const pick=rel=>{const f=chance(.5);return{name:nameFor(cultureOf(P),f,null),female:f,age:P.age+ri(18,32),rel};};
  const take=(rel,txt)=>()=>{
    const by=pick(rel);P.adopt={by,year:P.year,why:'orphan'};
    addLog(by.name+'의 보살핌을 받으며 자라게 되었다.');
    return v7RN(txt.replace('{by}',by.name),'m_orphan');};
  const opts=[
    {t:'가까운 친척의 집에서 지낸다',sub:'핏줄이 이어진 어른이 거둔다',fn:take('kin','아버지 쪽 친척 {by}이(가) {me}을(를) 거두었다. 낯선 살림에 익숙해지기까지 시간이 걸렸으나 끼니와 잠자리는 정해졌다.')},
    {t:'가문이나 이웃의 어른에게 맡겨진다',sub:'혈연은 아니지만 같은 무리의 어른이다',fn:take('elder','같은 무리의 어른 {by}이(가) {me}을(를) 맡겠다고 나섰다. 피를 나눈 사이는 아니었으나 문 앞에 서 있던 아이를 내치지는 않았다.')}
  ];
  if(sibs.length)opts.push({t:'형제자매와 함께 지낸다',sub:'정해진 양육자는 없다',fn:()=>{
    sibs.forEach(x=>{x.bond=Math.min(100,(x.bond||50)+8);});
    P.flags.b_orphan_sibs=1;addLog('형제자매와 서로 의지하며 지냈다.');
    return v7RN('{me}은(는) 남은 형제자매와 함께 지내기로 했다. 어른의 손은 빌렸다 말았다 했지만 서로의 곁이 있었다.','m_orphan');}});
  return v7sc('남겨진 아이','부모를 모두 잃은 {me}을(를) 누가 맡을지 이야기가 오갔다.',opts,'가문');
}

/* --- manumission : 자동 해방(manumit)을 선택형으로 바꾸지 않는다. 확률·조건·상태 변화는 그대로이고,
   결과 문장만 기존 문장과 마누스 문장이 번갈아 나온다(마누스의 '받아들인다/남는다' 선택과 직업 배정은 로직 충돌로 보류). --- */
manumit=function(force,chosen){ /* force: 주인과의 정식 혼인(v12_master_wed)처럼 해방이 이미 정해진 경우 확률 판정을 건너뜀. chosen: 선택형 해방 이벤트(c_manumission)에서 받아들인 경우 — 결과 문장은 장면이 주므로 지문은 남기지 않는다 */
  if(!force&&(P.flags.manumit_defer||0)>=P.year)return; /* 선택형 해방에서 "주인집에 남는다"를 고른 해를 1년 차로 4년간 자동 해방 유예(그해 판정은 이미 끝났으므로 이후 3번 건너뜀)(P.flags 에 저장되어 불러오기 후에도 유지) */
  if(!force&&!chance(.07+P.fame/900+(P.sk.craft+P.sk.know)/1500))return;
  P.status='free';P.rank=1;P.wealth=Math.max(P.wealth,3);fx({fame:3});
  if(!force||chosen)P.flags.freeWhy={y:P.year,w:'grace'}; /* 주인과의 정식 혼인(force)은 해방 사유로 기록하지 않는다 */
  if(!chosen)recapLine(chance(.5)?'주인이 불러 앉히더니 "오늘부터 너는 자유다"라고 했다. 해방되었다! 한동안 믿기지 않아 멍하니 서 있었다.'
    :v7RN('{me}은(는) 자유의 몸이 되었다. 가진 것은 적었으나 이름을 부르는 소리가 낯설게 따뜻했다.','m_freed'));
  addLog('주인에게서 해방되었다.');
  /* 마누스 _mn_res: 해방 뒤 직업은 기술≥28 → 기술자, 처세≥30 → 상인, 그 외 생업(목축·농사)으로 정하고 노예 연수를 지운다.
     주인과의 정식 혼인(force)은 직업을 건드리지 않는다. 여성은 현재 게임의 여성 직업(길쌈·펠트 장인 / 장터 상인)으로 대응한다. */
  if(!force||chosen){
    const j=v7sk('craft')>=28?(P.female?'weaver':'artisan'):v7sk('social')>=30?(P.female?'trader_f':'merchant'):'herder';
    setJob(j,0);delete P.flags.slave_years;
  }
};

   발생: 노예·포로 신분이고 slave_years≥3. 가중치 0.15+(기술+지식+처세)/300(마누스와 동일, 매번 계산), 쿨다운 4. --- */

function v12dailyPick(P){

  const idx=L.map((x,i)=>i).filter(i=>ok(L[i]));
  P.flags.v12_dl=P.flags.v12_dl||{};

  let left=idx.filter(i=>!used.includes(i));

/* ===== v12 D4: 가족 소식 표시 강화 (표시 계층 전용) =====

function v12kn(line,strict){

    if(/팔려/.test(line))return 'split';

    if(/소식이 끊|생사를 알 수 없|실종/.test(line))return 'missing';
    if(/희생|사망|세상을 떠났다/.test(line))return 'death';

  if(/포로로 끌려|끌려가 소식이 끊김/.test(line))return 'captive';
  if(/소식이 끊|생사를 알 수 없|실종/.test(line))return 'missing';

/* ===== 임신 건별 기록 · 친부 판정 · 첩/약탈혼 임신 장면 · 아이 거취 · 재회 =====

/* 뒤늦게 알게 되는 임신의 추정 임신 시점: 분리 기간의 마지막 yrs 해 가운데 한 해(연 8% 판정과 같은 구간) */

/* ---- 임신 기록과 만기 (일반·첩·약탈혼 임신 공통) ----

/* ===== v19: 소식이 끊긴 가족의 뒤늦은 소식 (모두에게 오지 않는다) =====

  }

    const fem=!!o.female;

  ['ko_w5',[1255,1259],'몽골군의 침입이 해를 거듭해 이어진다. 조정은 강화도에 머물러 있고, 육지의 백성은 산성과 섬을 오가며 버틴다.']

    fx({hp:-12});return koFail(near);}});
  o.push({t:'식구를 데리고 깊은 산속이나 먼 남쪽으로 피한다',sub:'가진 것을 많이 버린다',fn:()=>{
    if(roll(.6,P.sk.wit,P.hp/2)){P.flags.refugee=1;P.flags.survivor=1;loseWealth(.55);fx({hp:-6,wit:2});return '산속 절과 친척집을 전전하며 전란을 피했다. 돌아왔을 때 가진 것은 많이 줄어 있었다.';}

/* 끌려가는 경우: 기존 포로 처리(fate)를 그대로 쓴다. 이 경로의 문장은 '고려 사람'이 몽골에 끌려가는 상황에 맞게 앞에 한 문장을 붙인다 */
function koHurt(){loseWealth(.5);fx({hp:-ri(8,18)});P.flags.survivor=1;return '몽골 기병에게 쫓겨 가까스로 목숨만 건졌다. 가진 것 대부분을 잃고 다친 몸으로 길을 떠돌았다.';}
function koFail(place){return chance(.4)?koCaptured(place):koHurt();}
function koCaptured(place){
  const t=fate('captured',place||'고향 마을',{massacre:.05});
  const pre='몽골군에게 붙잡혔다.\n';
  return typeof t==='string'?pre+t:{text:pre.trim(),next:t.next};
}

/* v27 황금씨족 출생 구조 1차 정리: 출생 연도·가문·아버지의 생몰을 역사 데이터와 맞춘다.

/* 베르케(출생 1207~1221 논쟁·기록된 자녀는 딸뿐), 샤이반·토카티무르·코추·카단 등(생몰 연도 미확인)은 후보에서 제외했다. */
const LN_FIRST=1206; /* 황금씨족 출생이 시작되는 해(기존 규칙) */
const LN_CHILD_UNTIL=1232; /* 기존 규칙: 이 해까지는 수장의 자녀, 이후는 수장의 손자·손녀 */

/* 수장의 자녀로 태어날 수 있는 해: 수장이 아버지가 될 나이이고, 가장 이른 사망 연도 전이어야 한다 */
const lnChildOK=(h,y)=>{const d=LN_HOUSE[h];return y>=Math.max(LN_FIRST,d.born+LN_MINAGE)&&y<d.died[0];};
/* 수장의 아들 중 그 해에 아버지가 될 수 있는 사람(나이 조건 + 출생 때 생존) */
const lnSons=(h,y)=>LN_SON[h].filter(s=>y-(s.bornLate||s.born)>=LN_MINAGE&&y<s.died);

function lnFix(p){
  const y=p.born,cul=cultureOf(p),child=y<=LN_CHILD_UNTIL;
  let house=p.lineage.house;
  const names=Object.keys(LN_HOUSE);
  const ok=h=>child?lnChildOK(h,y):true;
  if(!ok(house)){ /* 그 해에 불가능한 가문이면 가능한 가문 중에서 다시 고른다 */

  }else{
    f.job=house+'의 아들(황금씨족)';f.alive=true;

  if(p.job==='lord'||p.job==='lady'){p.lv=0;p.peakLv=0;}
}
const _lnRollBirth=rollBirth;
rollBirth=function(){

  return p;
};

/* ---------- 황금씨족 지위 분리: 혈통만으로 '족장·칸·대노욘·오르도의 주인' 단계에 오르지 않는다 ----------
   황금씨족 출생 인물의 귀족·지배층(lord/lady) 직급은 LN_CAP 단계까지만 기존 승진 규칙으로 오른다.
   그 위(족장 이상)는 기존 후계 이벤트(p_succession '족장 자리의 다툼', succDisputeScene '족장 자리')에서 후계자로 선택되어
   P.flags.chief 가 켜지거나, 대칸 추대(P.flags.khan)가 이루어진 뒤에만 기존 승진 규칙으로 오른다.
   아버지의 생사는 따지지 않는다: 아버지가 살아 있는 동안은 물론 돌아가신 뒤에도 후계자로 선택되지 않으면 그대로다.
   황금씨족이 아닌 인물과 다른 직업에는 관여하지 않는다. */
const LN_CAP=1; /* 선택되지 않은 황금씨족 인물이 오를 수 있는 가장 높은 단계(lv): 지방 노욘(0) → 씨족 지도자(1) */
const _lnPromoCheck=promoCheck;
promoCheck=function(){
  if(P&&P.lineage&&(P.job==='lord'||P.job==='lady')&&!(P.flags&&(P.flags.chief||P.flags.khan))&&P.lv>=LN_CAP)return;
  return _lnPromoCheck.apply(this,arguments);
};

/* ---------- 가문 수장의 역사적 사망: 수장의 자녀로 태어난 황금씨족 인물에게만 ----------
   아버지(수장 또는 LN_SON 의 아들)는 무작위 사망 판정에서 빼고, 역사적 사망 해에 기존 부모 사망 처리와 같은 흐름으로 세상을 떠나게 한다.
   - 사인은 쓰지 않는다(cause='사인 미상'). 주치는 1225~1227년 사이에서 한 해를 골라 flags.lnDeathY 에 저장한다(해를 확정된 사실처럼 쓰지 않는다).
   - 플레이어의 생사와는 연결하지 않는다. 플레이어가 먼저 죽었으면 틱이 돌지 않아 발생하지 않는다.

const LN_DEATH={'주치':[1225,1227],'툴루이':[1232,1232],'오고타이':[1241,1241],'차가타이':[1242,1242]};
const LN_DEATH_TXT={
  '주치':'아버지 주치가 세상을 떠났다. 칭기즈칸의 맏아들로 서쪽 땅을 맡았던 이였다. 정확한 때와 사정은 전하는 말마다 달랐다.',
  '툴루이':'아버지 툴루이가 세상을 떠났다. 칭기즈칸의 막내아들이자 한때 제국의 섭정이었다. 가문은 상복을 입고 오랫동안 숨을 죽였다.',
  '오고타이':'아버지 오고타이가 세상을 떠났다. 십이 년 동안 제국을 다스린 대칸의 죽음이었다. 천막마다 곡소리가 이어졌고, 대칸의 자리는 한동안 비었다.',
  '차가타이':'아버지 차가타이가 세상을 떠났다. 중앙아시아의 울루스를 다스리던 이를 잃은 가문은 상복을 입고 장례를 치렀다.'
};
const lnChiefFather=p=>!!(p&&p.lineage&&p.lineage.rel==='아들'&&p.father&&LN_DEATH[p.lineage.house]&&p.father.name===p.lineage.house);
const lnDeathY=p=>{const d=LN_DEATH[p.lineage.house];p.flags=p.flags||{};
  if(!p.flags.lnDeathY)p.flags.lnDeathY=d[0]===d[1]?d[0]:ri(Math.max(d[0],p.born+1),d[1]);
  return p.flags.lnDeathY;};
/* 손자 세대: 아버지가 LN_SON 에 등록된 인물이면 그 인물의 사망 연도(LN_SON.died)를 쓴다. dUnc(연도 불확실) 인물은 서술에서 때를 단정하지 않는다. */
const LN_SON_TXT={
  '바투':'아버지 바투가 세상을 떠났다. 서쪽 초원을 다스리던 군주를 잃은 가문은 상복을 입고 장례를 치렀다.',
  '오르다':'아버지 오르다가 세상을 떠났다. 주치 가문의 한 갈래를 이끌던 이였다. 정확한 때는 전하는 기록마다 달랐다.',
  '귀위크':'아버지 귀위크가 세상을 떠났다. 대칸이 된 지 두 해 만의 일이라 오고타이 가문이 술렁였다.',
  '코텐':'아버지 코텐이 세상을 떠났다. 오고타이 가문의 왕자였다. 정확한 때는 전하는 기록마다 달랐다.',
  '몽케':'아버지 몽케가 세상을 떠났다. 재위 중인 대칸의 죽음에 왕족들이 후계를 두고 움직이기 시작했다.',
  '쿠빌라이':'아버지 쿠빌라이가 세상을 떠났다. 대칸이자 원의 황제였던 이의 장례가 치러졌다.',
  '훌라구':'아버지 훌라구가 세상을 떠났다. 일 칸국을 세운 군주를 잃은 가문은 상복을 입었다.',
  '아리크부카':'아버지 아리크부카가 세상을 떠났다. 한때 대칸을 칭했으나 쿠빌라이에게 항복한 뒤의 일이었다.'
};
const lnSonOf=p=>{if(!(p&&p.lineage&&p.lineage.rel==='손자'&&p.father&&LN_SON[p.lineage.house]))return null;
  return LN_SON[p.lineage.house].find(x=>x.name===p.father.name&&LN_SON_TXT[x.name])||null;};
/* 이 인물의 아버지가 역사적 사망 처리 대상이면 {y:사망 연도, txt:서술}, 아니면 null */
const lnHistFather=p=>{
  if(lnChiefFather(p))return {y:lnDeathY(p),txt:LN_DEATH_TXT[p.lineage.house]};

function lnChiefDies(f,info){

  addLog(`아버지 ${eul(f.name)} 여의었다.`);fx({hp:-5,wit:1});
  P.flags.fatherDead=1;
  /* 이하는 parentsTick 의 아버지 사망 후속 처리와 같다(후계 다툼 → 유산 → 막내 몫) */
  const sd=typeof succDisputeScene==='function'?succDisputeScene():null;
  if(sd)G.q.push(sd);
  else if(P.sibs.some(s=>sibReach(s)&&s.age>=12)&&P.rank>=2&&P.age>=15&&chance(.6))G.q.push(inheritScene());

}
const _lnParentsTick=parentsTick;
parentsTick=function(){

  f.alive=false; /* 무작위 사망 판정에서만 뺀다 */
  let r;try{r=_lnParentsTick.apply(this,arguments);}finally{f.alive=true;}
  f.age++;
  if(P.year>=info.y)lnChiefDies(f,info);

};
/* v28 플레이어 포로 신분의 생성·유지·종료 기록.
   P.flags.pcap = {y:포로가 된 해, age, by:경로, from:{pol,tribe,region,rank}|null, offered:0|1, end:null|{y,how,to}}
   - 가족 구성원의 captive{...}(v9_war.js)와 별개다. 그쪽은 읽지도 쓰지도 않는다.
   - freeWhy 에는 쓰지 않는다(everEnslaved()·작명 판정에 영향이 없도록).
   - v9captured 는 실제 status='slave' 이므로 pcap 을 만들지 않는다.
   - 종료 후에도 기록은 지우지 않는다. 다시 포로가 되면 이전 기록은 P.flags.pcapHist 로 옮긴다. */
const PCAP_YEARS=6;
const PCAP_LAB=/^(.*)계 (포로|인질)$/;
function capFrom(){return{pol:P.pol,tribe:P.tribe,region:P.region,rank:P.rank};}
function capNew(how,from){
  const f=P.flags;if(!f)return;
  if(f.pcap&&!f.pcap.end)return; /* 이미 포로: 처음 시작 시점을 유지 */
  if(f.pcap)(f.pcapHist=f.pcapHist||[]).push(f.pcap);
  f.pcap={y:P.year,age:P.age,by:how,from:from||null,offered:0,end:null};
}
function capMark(how,from){capNew(how,from);}
/* 포로 라벨을 최종 신분에 맞게 바꾼다. 라벨이 없으면(인질이 현지에 머문 경우 등) 손대지 않는다. */
function capRelabel(mode){
  const m=PCAP_LAB.exec(P.tribe||'');if(!m)return;
  P.tribe=mode==='bound'?m[1]+'계 종속민':mode==='slave'?m[1]+'계 노예':m[1]+' 출신';
}
function capDropQ(){for(let i=G.q.length-1;i>=0;i--)if(G.q[i]&&G.q[i].pcap6)G.q.splice(i,1);}
/* 포로가 끝났음을 기록한다. 이미 끝난 기록은 덮어쓰지 않는다. 아직 captive 이면 끝난 것이 아니다. */
function capEndP(how){
  const c=P.flags&&P.flags.pcap;if(!c||c.end||P.status==='captive')return;
  c.end={y:P.year,how:how,to:P.status};c.offered=1;

}
/* 구세이브·표시 없이 생긴 포로는 지금을 시작점으로 삼고, 사후에 신분이 바뀐/죽은 포로는 닫는다 */
function capEnsure(){
  const f=P&&P.flags;if(!f)return;
  const c=f.pcap;
  if(P.dead){if(c&&!c.end){c.end={y:P.deathYear||P.year,how:'death',to:P.status};c.offered=1;}return;}

      if(!still())return '이미 처지가 달라졌다.';

      P.status='free';P.rank=Math.max(P.rank||0,1);careerReopen();capEndP('return');
      addLog('풀려나 원래의 땅으로 돌아갔다.');

const V41_DESC={kin:['자녀가 없는 먼 친척 집안','대를 이을 아이가 없는 친척 집안'],patron:['아이를 눈여겨본 이웃의 유력한 집안','살림이 넉넉한 후원자 집안'],care:['양육자의 집안']};

function entryHTML(e,fresh){
  const f=fresh?' fresh':'';

  if(e.k==='event')return `<div class="ev${e.kin?' kin-'+e.kin:''}${f}"><div class="t">${sn}${esc(e.title)}</div><div class="pk">${e.kin?'':'선택 · '}${esc(e.pick)}</div>${e.text?`<p>${(typeof v12kinText==='function'&&!e.kin)?v12kinText(e.text):esc(e.text)}</p>`:''}${chipsHTML(e.chips)}</div>`;
  if(e.k==='note')return `<div class="note${f}"><b>역사 노트</b>${esc(e.title)} — ${esc(e.text)}</div>`;
  if(e.k==='end')return `<div class="endx${f}">${esc(e.title)}</div>`;
  /* 출생 항목에 붙은 '세상 소식'은 해마다의 소식과 같은 양식(.nw)으로 따로 보여 준다 */
  const tx=String(e.text||'').split('\n'),nw=tx.filter(l=>l.indexOf('세상 소식 · ')===0),bd=tx.filter(l=>l.indexOf('세상 소식 · ')!==0).join('\n');
  return `<div class="sysx${f}"><div class="t">${esc(e.title)}</div>${bd?`<p class="fp" style="margin:2px 0 0">${esc(bd)}</p>`:''}${nw.map(n=>`<p class="nw" style="margin:6px 0 0">${esc(n)}</p>`).join('')}</div>`;
}
function feedHTML(){
  const f=G.feed||[],n=Math.min(V.feedN,f.length);
  let html=decHTML(),cur=null,buf='';
  const flush=()=>{if(cur!==null)html+=`<div class="dv">— ${esc(cur)} —</div>`+buf;buf='';};
  for(let i=0;i<n;i++){
    const e=f[i];
    const key=e.head?e.head:(e.k==='sys'?`${e.y}년 · 출생`:`${e.y}년 · ${e.a}세`);
    if(key!==cur){flush();cur=key;}
    buf+=entryHTML(e,e.id===G.fresh&&!V.noFresh);
  }
  flush();
  return html+(f.length>n?`<button class="more" data-act="more">이전 기록 더 보기 (${f.length-n})</button>`:'');
}

function renderPlay(parts){
  if(!document.getElementById('feed'))playShell();
  parts=parts||ALL;
  const q=id=>document.getElementById(id);
  if(parts.includes('t'))q('top').innerHTML=topHTML();
  if(parts.includes('b'))q('tabs').innerHTML=tabsHTML();
  if(parts.includes('p'))q('pbox').innerHTML=pboxHTML();
  if(parts.includes('c'))q('ctlBox').innerHTML=ctlHTML();
  if(parts.includes('l')){
    const fd=q('feed'),desk=deskMode();
    const h0=desk?fd.scrollHeight:document.documentElement.scrollHeight,s0=desk?fd.scrollTop:window.scrollY;
    fd.innerHTML=feedHTML();
    if(s0>40){ // 아래 기록을 읽는 중이면 위치를 유지한다 (자동으로 위로 올리지 않는다)
      if(desk)fd.scrollTop=s0+(fd.scrollHeight-h0);
      else window.scrollTo(0,s0+(document.documentElement.scrollHeight-h0));
    }
  }
  updProg();
}
const ALL='tbpcl';
function updProg(){
  const p=document.getElementById('prog');if(!p||!G.run)return;
  const r=G.run,S=G.scene;
  const f=S&&S.kind==='event'?(r.auto?Math.min(1,r.dec/2400):1):(r.plan?Math.min(1,r.acc/r.yearMs):0);
  p.style.width=(f*100).toFixed(1)+'%';
  p.style.background=S&&S.kind==='event'&&!r.auto?'var(--bad)':'var(--gold)';
  const d=document.getElementById('dateTxt');if(d)d.textContent=dateTxt();
}
function afterChange(){
  if(!G.scene)return;
  if(G.scene.kind==='end'){showEnding();return;}
  renderPlay(ALL);
}

  const a=t.closest('[data-act]');

    else if(act==='tab'){V.tab=V.tab===a.dataset.k?'':a.dataset.k;renderPlay('bp');}

const v48esc=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function v48statusTest(a,b){

  if(a==='captive'&&b==='free')return /풀려|석방|해방|자유|귀환|돌아/;

function v48make(s0){

const v48clear=()=>{v48H=[];v48NL=new Set();};

    v48H.forEach(h=>Object.keys(h.f).forEach(k=>{
      const x=h.f[k];undo.push([h.o,k,h.o[k],k in h.o]);
