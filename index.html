  if((P.wealth||0)>=50)L.push('w');
  if(widowed(P)&&P.age>=25)L.push('s');
  if(P.fame<=15&&P.age>=20)L.push('l');
  return L;
}
const v50bad=P=>v50cd(P,'bad')&&P.rank<=2&&v50badTheme(P).length>0;
function v50mkBad(P){
  const th=v50pick(v50badTheme(P));v50set(P,'bad',12);
  const body={w:'갑자기 불어난 살림을 두고 말이 돈다. 재물이 어디서 났느냐는 수군거림이다.',s:'혼자 사는 사정을 두고 말이 돈다. 이런저런 억측이 보태져 퍼지는 중이다.',l:'일을 대충 한다는 말이 돈다. 확인도 없이 그럴듯한 이야기만 퍼진다.'}[th];
  const act={w:{t:'이웃과 살림을 나누며 마음을 산다',sub:'재산 −, 명성 +',fn:()=>{fx({wealth:-3,fame:3});return '이웃에게 곡식과 일손을 나누자 수군거림이 잦아들고 인심이 후하다는 말로 바뀌었다.';}},
    s:{t:'사람들 앞에 자주 나서 어울린다',sub:'지혜 +',fn:()=>{fx({wit:1,fame:1,hp:-1});return '모임과 잔치마다 얼굴을 비추자 억측은 시간이 지나며 사그라들었다.';}},
    l:{t:'일에 더 힘을 쏟아 보여 준다',sub:'체력 −, 명성 +',fn:()=>{fx({hp:-2,fame:2,craft:1});return '묵묵히 일을 마무리해 내자 소문은 저절로 힘을 잃었다.';}}}[th];
  return v7sc('곤란한 소문',`${v50place(P)}에서 {me}에 관한 ${body}`,[
    {t:'사람들 앞에서 해명한다',sub:'처세에 따라 달라진다',fn:()=>{if(v7roll(v7odds(['social'],.35,150))){fx({fame:2});v7gr('social',1);return '차분히 사정을 설명하자 오해가 풀렸다.';}fx({fame:-2});return '해명이 오히려 말을 키웠다. 한동안 사람들의 눈길이 따가웠다.';}},
    {t:'대꾸하지 않고 지켜본다',sub:'몸과 재산을 쓰지 않는다, 운이 따라야 한다',fn:()=>{fx({hp:1});if(v7roll(.55)){fx({wit:1});return '대응하지 않자 소문은 다른 이야깃거리에 묻혔다. 마음도 한결 가벼웠다.';}fx({fame:-1});return '가만히 있으니 말이 더 퍼졌다. 입을 닫은 것이 인정으로 비쳤다.';}},
    act
  ],'소문');
}
/* ---- 7 지난 신분을 들추는 말: P.flags.freeWhy 기준 해방 후 10년 이내 ---- */
const v50past=P=>{const fw=P.flags&&P.flags.freeWhy;return v50cd(P,'past')&&v50S(P).ps<2&&!!fw&&typeof fw.y==='number'&&P.year-fw.y>=1&&P.year-fw.y<=10;};
function v50mkPast(P){
  const fw=P.flags.freeWhy,S=v50S(P);S.ps++;v50set(P,'past',5);
  const how=fw.w==='escape'?'주인에게서 도망쳐 나온':fw.w==='ransom'?'몸값을 치르고 풀려난':fw.w==='grace'?'주인의 은혜로 풀려난':'한때 종살이를 하던';
  const fr=v50ties(P)[0]; /* 실제로 곁에 있는 친구가 있을 때만 세 번째 선택지를 낸다 */
  const opts=[
    {t:'지난 일을 당당히 밝힌다',sub:'처세에 따라 달라진다',fn:()=>{if(v7roll(v7odds(['social'],.4,150,P.fame/500))){fx({fame:3});v7gr('social',1);return '숨기지 않고 말하자 오히려 용기 있다는 평이 돌았다.';}fx({fame:-2});return '밝혔지만 일부는 냉랭했다. 지난 신분은 쉽게 잊히지 않았다.';}},
    {t:'입을 다물고 일로 증명한다',sub:'재산 +, 지혜 +, 명성이 오르지는 않는다',fn:()=>{fx({wit:1,wealth:2});if(v7roll(.4))fx({fame:-1});return '대꾸하지 않고 묵묵히 제 몫을 다했다. 일이 쌓이는 동안 말은 서서히 잦아들었다.';}}
  ];
  if(fr){const n=v50who(P,fr).name;opts.push({t:`곁의 벗 ${n}이(가) 나서 주기를 청한다`,sub:'우정에 달렸다',fn:()=>{if(!v50tieOk(P,fr))return v50gone;
    if(v7roll(.45+Math.min(.3,(fr.bond||0)/250))){tieBond(fr,5);fx({fame:2});return `${n}이(가) 나서서 사람됨을 보증해 주자 말이 수그러들었다.`;}tieBond(fr,-2);return `${n}이(가) 거들었지만 사람들의 입은 쉽게 닫히지 않았다.`;}});}
  return v7sc('지난 신분을 들추는 말',`${how} 지난 일을 두고 ${v50place(P)}에서 수군대는 이들이 있다. 해마다 쌓은 시간이 있어도, 지난 신분은 입길에 쉽게 오른다.`,opts,'소문');
}
/* ---- 8 먼 곳 식구의 부탁: 시집가 따로 사는 딸·누이 중 wedVisitLive 인 사람 ---- */
const v50kinOk=o=>!!o&&wedOut(o)&&wedVisitLive(o)&&!o.captive&&!o.absent&&(o.age||0)>=16;
const v50kinKey=o=>(o.name||'')+(o.female?'f':'m');
function v50kinList(P){
  const L=[];(P.sibs||[]).forEach(s=>{if(v50kinOk(s))L.push({o:s,w:sibWord(s)});});(P.kids||[]).forEach(k=>{if(v50kinOk(k))L.push({o:k,w:k.adoptive?'양녀':'딸'});});
  return L.filter(m=>!(v50S(P).kin[v50kinKey(m.o)]>P.year)&&!G.q.some(s=>s&&(s.kin===m.o||s.vis===m.o)));
}
const v50kin=P=>v50cd(P,'kin')&&P.age>=16&&v50kinList(P).length>0;
function v50mkKin(P){
  const m=v50pick(v50kinList(P));if(!m)return null;
  const o=m.o,w=m.w,n=o.name;v50set(P,'kin',11);v50S(P).kin[v50kinKey(o)]=P.year+13;
  const add=d=>{o.bond=clamp((o.bond!==undefined?o.bond:(P.harmony||50))+d);};
  const why=v50herd(P)?'시댁이 가축을 잃어 겨울을 나기 어렵게 되었다':'시댁 살림이 기울어 끼니가 어렵게 되었다';
  const live=()=>v50kinOk(o)&&P.status==='free';
  const opts=[];
  if((P.wealth||0)>=12)opts.push({t:'넉넉히 챙겨 인편에 실어 보낸다',sub:'재산 −, 정 +',fn:()=>{if(!live())return v50gone;add(12);fx({wealth:-ri(5,9),fame:1});return `${n}에게 곡식과 천을 실어 보냈다. 답으로 온 말은 고맙다는 한마디뿐이었지만 마음은 충분히 닿았다.`;}});
  opts.push({t:'형편 닿는 만큼만 보낸다',sub:'재산 −(적게)',fn:()=>{if(!live())return v50gone;add(5);fx({wealth:-ri(1,3)});return `${n}에게 보낼 수 있는 만큼만 보냈다. 넉넉하진 않아도 잊지 않았다는 뜻은 전해졌을 것이다.`;}});
  opts.push({t:'우리 형편도 어렵다고 답한다',sub:'정이 식고 체면이 상한다',fn:()=>{if(!live())return v50gone;add(-10);fx({fame:-1});return `사정이 어렵다는 답을 보냈다. 친정이 박정하다는 말이 들렸고, ${n}에게서는 한동안 소식이 없었다.`;}});
  return v7sc(`시집간 ${w}의 청`,`시집간 ${w} ${n}이(가) 인편에 소식을 보내왔다. ${why}는 사연과 함께, 친정에 염치없이 도움을 청한다는 말이 적혀 있었다.`,opts,'가족');
}
/* ---- 연초 판정 ---- */
const V50EV=[
  {id:'reunion',w:3,tie:1,ok:P=>v50reun(P).length>0,mk:v50mkReunion},
  {id:'repay',w:2,tie:1,ok:P=>v50repay(P).length>0,mk:v50mkRepay},
  {id:'visit',w:2,tie:1,ok:P=>v50visit(P).length>0,mk:v50mkVisit},
  {id:'up',w:1.5,tie:1,ok:P=>v50up(P).length>0,mk:v50mkUp},
  {id:'past',w:2,ok:v50past,mk:v50mkPast},
  {id:'good',w:.5,ok:v50good,mk:v50mkGood},
  {id:'bad',w:.5,ok:v50bad,mk:v50mkBad},
  {id:'kin',w:.6,ok:v50kin,mk:v50mkKin}
];
function v50roll(P){
  if(!P||P.dead||P.status!=='free'||P.age<14||!v50peace(P))return;
  const S=v50S(P);
  tieList(P).forEach(t=>{if(t.gapY&&P.year-t.gapY.y>5)delete t.gapY;}); /* 오래 묵은 공백 기록 정리 */
  if(S.y===P.year||G.q.length>=2)return;
  const c=V50EV.filter(e=>{try{return (!e.tie||t2ok(P))&&e.ok(P);}catch(x){return false;}});
  if(!c.length)return;
  if(Math.random()>=V50_P)return;
  let x=Math.random()*c.reduce((a,e)=>a+e.w,0),e=c[0];
  for(const y of c){x-=y.w;if(x<=0){e=y;break;}}
  if(e.tie){V50def=e.id;S.y=P.year;return;} /* 친구·인맥 장면은 올해 계획이 다 만들어진 뒤(아래 beginYear 래퍼)에 t2ok 를 다시 확인하고 넣는다 */
  const s=e.mk(P);
  if(s){S.y=P.year;s.v50=e.id;G.q.push(s);}
}
/* 기존 친구 이벤트가 같은 해 뒤늦게(추가 일반 이벤트) 뽑히는 경우 기존 이벤트를 막지 않기 위해, 이 모듈의 친구 장면은 계획이 끝난 뒤
   t2ok 가 여전히 참일 때만 만든다(만들면 t2mark 로 한 해 한 번 제한을 그대로 지킨다). 거짓이면 이번 해는 건너뛰고 쿨타임도 걸지 않는다. */
let V50def=null;
function v50fire(P,id){
  const e=V50EV.find(x=>x.id===id),pl=G.run&&G.run.plan;
  if(!e||!pl||!P||P.dead||P.status!=='free'||!t2ok(P)||!e.ok(P))return;
  const s=e.mk(P);if(!s)return;
  s.v50=e.id;v50S(P).y=P.year;
  pl.items.push({t:.1+Math.random()*.8,type:'scene',scene:s});
  pl.items.sort((x,y)=>x.t-y.t);
}
(function(){
  const h=yearHook;
  yearHook=function(){const r=h.apply(this,arguments);try{v50roll(P);}catch(e){}return r;};
  const bY=beginYear;
  beginYear=function(){
    V50def=null;
    const r=bY.apply(this,arguments);
    try{const id=V50def;V50def=null;if(id)v50fire(P,id);}catch(e){}
    return r;
  };
})();
/* v51 관직 이벤트 발생 보장 — 추천 임명(v35)과 사임·해임(v39)이 일반 이벤트 풀에 묻혀 거의 뜨지 않던 것을, 연초(yearHook) 뒤에 독립적으로 한 번 판정해 대기열에 넣는다.
   - 기존 이벤트(v35_off_merit·house·deed, v39_office_resign·dismiss)의 조건·장면·선택지·효과·once 규칙은 그대로 쓴다(e.cond → e.mk). 기존의 무작위 발생도 그대로 둔다.
   - 임명: 조건을 갖춘 해마다 V51_APPT(25%). 세 경로 중 조건이 맞는 것을 기존 가중치로 고른다. 평생 한 번씩(once)·임명 뒤 8년(v35_next)은 기존 규칙 그대로다.
   - 사임: 관직 보유 중 조건(55세 이상·체력 40 미만·정복지 출신이며 명성 10 이하)을 갖춘 해마다 V51_RES(20%).
   - 해임: 관직 재임 3년 이상인 해마다 V51_DIS(6%). 같은 해 사임이 먼저 뽑히면 해임은 건너뛴다.
   - 한 해에 이 모듈의 장면은 최대 1개, 대기열에 이미 2개 이상이면 건너뛴다. P.flags.v51={y}. 새 필드는 이것뿐이다. */
const V51_APPT=.25,V51_RES=.20,V51_DIS=.06;
const v51ev=id=>[].concat(GEN,V7EV).find(e=>e.id===id);
function v51roll(P){
  if(!P||P.dead||P.female||P.status!=='free'||P.captive||!P.flags)return;
  const S=P.flags.v51=P.flags.v51||{};
  if(S.y===P.year||G.q.length>=2)return;
  const take=(id)=>{const e=v51ev(id);if(!e)return false;let s=null;try{if(!e.cond(P))return false;}catch(x){return false;}
    s=e.mk(P);if(!s)return false;S.y=P.year;s.v51=id;G.q.push(s);return true;};
  if(P.flags.office){
    if(Math.random()<V51_RES&&take('v39_office_resign'))return;
    if(Math.random()<V51_DIS&&take('v39_office_dismiss'))return;
    return;
  }
  if(Math.random()>=V51_APPT)return;
  const c=['v35_off_merit','v35_off_house','v35_off_deed'].map(v51ev).filter(e=>{try{return e&&e.cond(P);}catch(x){return false;}});
  if(!c.length)return;
  let x=Math.random()*c.reduce((a,e)=>a+e.w,0),e=c[0];
  for(const y of c){x-=y.w;if(x<=0){e=y;break;}}
  take(e.id);
}
{
  const h=yearHook;
  yearHook=function(){const r=h.apply(this,arguments);try{v51roll(P);}catch(e){}return r;};
}
